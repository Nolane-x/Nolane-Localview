name: V4.3 Verified Input Runtime Source Land Once

on:
  push:
    branches:
      - feat/v43-l7-windows-w07-w08-w09-input-authority

permissions:
  contents: write

jobs:
  land-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/v43-l7-windows-w07-w08-w09-input-authority
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply already-proven Task 4 source patch
        run: python .github/scripts/v43_verified_input_runtime_green.py
      - name: Restore workflow files before verification and commit
        run: git restore .github/workflows/v43-green-proof.yml
      - name: Format
        run: cargo fmt --all
      - name: Runtime authority contract
        run: cargo test -p localview-windows-observe-runtime --test verified_input_execution_contract -- --nocapture
      - name: Coordinator behavior
        run: cargo test -p localview-windows-observe-runtime --test execution_coordinator_behavior -- --nocapture
      - name: Dispatch classification
        run: cargo test -p localview-windows-observe-runtime --test verified_input_dispatch_classification -- --nocapture
      - name: Journal regression
        run: cargo test -p localview-live-bridge --lib -- --nocapture
      - name: Provider authority binding
        run: cargo test -p localview-windows-uia-provider --test verified_input_authority_binding_contract -- --nocapture
      - name: Provider contract
        run: cargo test -p localview-windows-uia-provider --test verified_input_contract -- --nocapture
      - name: Runtime compile
        run: cargo check -p localview-windows-observe-runtime
      - name: Commit source-only GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset
          git add crates/windows-observe-runtime/src/execution_arm.rs
          git add crates/windows-observe-runtime/src/runtime_manager.rs
          git add crates/windows-observe-runtime/src/verified_execution.rs
          git add crates/windows-uia-provider/src/subscription_stub.rs
          git diff --cached --check
          git commit -m "feat(v43): linearize verified input through canonical journal"
          git push origin HEAD:feat/v43-l7-windows-w07-w08-w09-input-authority

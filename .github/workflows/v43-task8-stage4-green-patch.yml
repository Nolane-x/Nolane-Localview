name: V4.3 Task 8 Stage 4 GREEN Patch

on:
  pull_request:
    paths:
      - '.github/workflows/v43-task8-stage4-green-patch.yml'

permissions:
  contents: write

jobs:
  patch-stage4:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Wire exact SetValue confirmation to dedicated verified execution
        shell: python
        run: |
          from pathlib import Path

          child = Path('crates/control/src/windows_consequential/set_value_http.rs')
          text = child.read_text(encoding='utf-8')

          old = 'use localview_live_bridge::{SetValueCommitmentKey, SetValueMode, SetValuePayloadRef};\n'
          new = '''use localview_live_bridge::{\n    SetValueCommitmentKey, SetValueMode, SetValuePayloadRef, verify_set_value_payload_binding,\n};\n'''
          if text.count(old) != 1:
              raise SystemExit('SetValue import anchor was not unique')
          text = text.replace(old, new, 1)

          old = '''    #[cfg_attr(\n        not(test),\n        expect(\n            dead_code,\n            reason = "Task 8 authority-owned peek is introduced before exact-confirmation route wiring"\n        )\n    )]\n    async fn peek(\n'''
          new = '''    pub(super) async fn peek(\n'''
          if text.count(old) != 1:
              raise SystemExit('SetValue peek anchor was not unique')
          text = text.replace(old, new, 1)

          old = '''    #[cfg_attr(\n        not(test),\n        expect(\n            dead_code,\n            reason = "Task 8 authority-owned consume is introduced before exact-confirmation route wiring"\n        )\n    )]\n    async fn consume(\n'''
          new = '''    async fn consume(\n'''
          if text.count(old) != 1:
              raise SystemExit('SetValue consume anchor was not unique')
          text = text.replace(old, new, 1)

          release_anchor = '''    pub(super) async fn release_session(&self, session_id: SessionId) {\n'''
          consume_verified = '''    pub(super) async fn consume_verified(\n        &self,\n        journal: &localview_live_bridge::ConsequentialJournal,\n        session_id: SessionId,\n        action_id: Uuid,\n        confirmation_ref: Uuid,\n    ) -> Result<Option<ConfirmedWindowsSetValuePayload>, String> {\n        let Some(candidate) = self\n            .consume(session_id, action_id, confirmation_ref)\n            .await\n        else {\n            return Ok(None);\n        };\n        let payload = candidate.payload;\n        let binding = journal\n            .set_value_payload_binding(action_id)\n            .await\n            .map_err(|error| format!("SetValue payload binding could not be loaded: {error}"))?\n            .ok_or_else(|| "SetValue durable payload binding is missing".to_owned())?;\n        let payload_utf8_len = u64::try_from(payload.utf8_len())\n            .map_err(|_| "SetValue process-local payload length is not representable".to_owned())?;\n        if binding.action_id != action_id\n            || binding.payload_ref != payload.payload_ref\n            || binding.mode != payload.mode\n            || binding.payload_utf8_len != payload_utf8_len\n        {\n            return Err(\n                "SetValue durable payload binding metadata does not match process-local authority"\n                    .to_owned(),\n            );\n        }\n        verify_set_value_payload_binding(\n            self.commitment_key.as_ref(),\n            &binding,\n            payload.utf8_bytes(),\n        )\n        .map_err(|error| format!("SetValue payload commitment verification failed: {error}"))?;\n\n        Ok(Some(ConfirmedWindowsSetValuePayload { payload }))\n    }\n\n'''
          if text.count(release_anchor) != 1:
              raise SystemExit('SetValue release anchor was not unique')
          text = text.replace(release_anchor, consume_verified + release_anchor, 1)

          old = '''struct PendingWindowsSetValuePayload {\n    session_id: SessionId,\n    confirmation_ref: Uuid,\n    #[cfg_attr(\n        not(test),\n        expect(\n            dead_code,\n            reason = "Task 8 payload remains process-local but is not read until Stage 4 exact-confirmation dispatch wiring"\n        )\n    )]\n    payload: ProcessLocalSetValuePayload,\n}\n\n#[cfg_attr(\n    not(test),\n    expect(\n        dead_code,\n        reason = "Task 8 Stage 2 exact-confirmation peek is intentionally introduced before Stage 4 confirmation wiring"\n    )\n)]\nfn peek_pending_set_value_payload(\n'''
          new = '''struct PendingWindowsSetValuePayload {\n    session_id: SessionId,\n    confirmation_ref: Uuid,\n    payload: ProcessLocalSetValuePayload,\n}\n\npub(super) struct ConfirmedWindowsSetValuePayload {\n    payload: ProcessLocalSetValuePayload,\n}\n\nimpl ConfirmedWindowsSetValuePayload {\n    pub(super) fn payload_ref(&self) -> SetValuePayloadRef {\n        self.payload.payload_ref\n    }\n\n    pub(super) fn mode(&self) -> SetValueMode {\n        self.payload.mode\n    }\n\n    pub(super) fn utf8_bytes(&self) -> &[u8] {\n        self.payload.utf8_bytes()\n    }\n}\n\nfn peek_pending_set_value_payload(\n'''
          if text.count(old) != 1:
              raise SystemExit('SetValue pending/wrapper anchor was not unique')
          text = text.replace(old, new, 1)

          old = '''#[cfg_attr(\n    not(test),\n    expect(\n        dead_code,\n        reason = "Task 8 Stage 2 one-shot consume is intentionally introduced before Stage 4 confirmation wiring"\n    )\n)]\nfn consume_pending_set_value_payload(\n'''
          new = '''fn consume_pending_set_value_payload(\n'''
          if text.count(old) != 1:
              raise SystemExit('SetValue consume helper anchor was not unique')
          text = text.replace(old, new, 1)
          child.write_text(text, encoding='utf-8')

          parent = Path('crates/control/src/windows_consequential.rs')
          text = parent.read_text(encoding='utf-8')
          old = '''use localview_windows_observe_runtime::{\n    WindowsUiaActionPreflightRequest, WindowsUiaAuthorizationRevalidationReceipt,\n    WindowsUiaAuthorizationRevalidator, WindowsUiaSemanticPostconditionVerifier,\n    WindowsUiaVerifiedActionTarget, WindowsUiaVerifiedExecutionOutcome,\n    execute_verified_canonical_uia_action,\n};\n'''
          new = '''use localview_windows_observe_runtime::{\n    WindowsUiaActionPreflightRequest, WindowsUiaAuthorizationRevalidationReceipt,\n    WindowsUiaAuthorizationRevalidator, WindowsUiaDispatchSealRequest,\n    WindowsUiaPreparedDispatchRequest, WindowsUiaSemanticPostconditionVerifier,\n    WindowsUiaSetValueExecutionPayload, WindowsUiaVerifiedActionTarget,\n    WindowsUiaVerifiedExecutionOutcome, arm_uia_dispatch_execution,\n    execute_armed_uia_set_value_dispatch, execute_verified_canonical_uia_action,\n    prepare_uia_dispatch,\n};\n'''
          if text.count(old) != 1:
              raise SystemExit('runtime import anchor was not unique')
          text = text.replace(old, new, 1)

          start_marker = 'async fn confirm_windows_consequential_action(\n'
          end_marker = '\nasync fn peek_pending_plan(\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('confirmation function markers were not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''async fn confirm_windows_consequential_action(\n    State(state): State<ControlState>,\n    headers: HeaderMap,\n    Path((session_id, action_id)): Path<(SessionId, Uuid)>,\n    Json(request): Json<WindowsConsequentialConfirmRequest>,\n) -> axum::response::Response {\n    if !authorized(&headers, &state) {\n        return denied();\n    }\n    if state.sessions.get(session_id).await.is_none() {\n        return session_not_found();\n    }\n    let Some(runtime) = windows_observe_runtime_for_sessions(&state.sessions) else {\n        return unavailable("Windows UIA runtime is unavailable");\n    };\n    let Some(control) = windows_consequential_control_for_sessions(&state.sessions) else {\n        return unavailable("durable consequential control journal is unavailable");\n    };\n\n    // Planning, session release, and confirmation all share this gate so an exact\n    // SetValue confirmation cannot race either process-local authority map.\n    let plan_gate = control.plan_gate.lock().await;\n    let Some(peeked) =\n        peek_pending_plan(&control, session_id, action_id, request.confirmation_ref).await\n    else {\n        return confirmation_missing_or_consumed();\n    };\n\n    // Pure executor resolution happens before consuming either one-shot capability.\n    // A missing attachment therefore cannot burn an otherwise valid confirmation.\n    let executor = match runtime.uia_dispatch_executor(session_id).await {\n        Ok(executor) => executor,\n        Err(error) => {\n            return (\n                StatusCode::CONFLICT,\n                Json(serde_json::json!({\n                    "error": "windows_consequential_executor_unavailable",\n                    "message": error.to_string(),\n                    "dispatch_performed": false,\n                    "confirmation_consumed": false,\n                })),\n            )\n                .into_response();\n        }\n    };\n\n    let admitted_operation = match control.journal.admitted_operation(action_id).await {\n        Ok(Some(operation)) => operation,\n        Ok(None) => {\n            let _ = consume_pending_plan(\n                &control,\n                session_id,\n                action_id,\n                request.confirmation_ref,\n            )\n            .await;\n            return (\n                StatusCode::CONFLICT,\n                Json(serde_json::json!({\n                    "error": "windows_consequential_operation_binding_missing",\n                    "action_id": action_id,\n                    "confirmation_consumed": true,\n                    "retry_allowed": false,\n                    "replan_required": true,\n                })),\n            )\n                .into_response();\n        }\n        Err(error) => {\n            let _ = consume_pending_plan(\n                &control,\n                session_id,\n                action_id,\n                request.confirmation_ref,\n            )\n            .await;\n            if control\n                .set_value\n                .peek(session_id, action_id, request.confirmation_ref)\n                .await\n            {\n                let _ = control\n                    .set_value\n                    .consume_verified(\n                        control.journal.as_ref(),\n                        session_id,\n                        action_id,\n                        request.confirmation_ref,\n                    )\n                    .await;\n            }\n            return (\n                StatusCode::CONFLICT,\n                Json(serde_json::json!({\n                    "error": "windows_consequential_operation_binding_unavailable",\n                    "message": error.to_string(),\n                    "action_id": action_id,\n                    "confirmation_consumed": true,\n                    "retry_allowed": false,\n                    "replan_required": true,\n                })),\n            )\n                .into_response();\n        }\n    };\n\n    let set_value_payload_pending = control\n        .set_value\n        .peek(session_id, action_id, request.confirmation_ref)\n        .await;\n    let is_set_value = admitted_operation == CanonicalActionOperation::SetValue;\n    if is_set_value != set_value_payload_pending {\n        let _ = consume_pending_plan(\n            &control,\n            session_id,\n            action_id,\n            request.confirmation_ref,\n        )\n        .await;\n        if set_value_payload_pending {\n            let _ = control\n                .set_value\n                .consume_verified(\n                    control.journal.as_ref(),\n                    session_id,\n                    action_id,\n                    request.confirmation_ref,\n                )\n                .await;\n        }\n        return (\n            StatusCode::CONFLICT,\n            Json(serde_json::json!({\n                "error": "windows_consequential_set_value_authority_mismatch",\n                "action_id": action_id,\n                "confirmation_consumed": true,\n                "retry_allowed": false,\n                "replan_required": true,\n            })),\n        )\n            .into_response();\n    }\n\n    let Some(plan) =\n        consume_pending_plan(&control, session_id, action_id, request.confirmation_ref).await\n    else {\n        return confirmation_missing_or_consumed();\n    };\n    let confirmed_set_value = if is_set_value {\n        match control\n            .set_value\n            .consume_verified(\n                control.journal.as_ref(),\n                session_id,\n                action_id,\n                request.confirmation_ref,\n            )\n            .await\n        {\n            Ok(Some(payload)) => Some(payload),\n            Ok(None) => {\n                return (\n                    StatusCode::CONFLICT,\n                    Json(serde_json::json!({\n                        "error": "windows_consequential_set_value_payload_missing",\n                        "action_id": action_id,\n                        "confirmation_consumed": true,\n                        "retry_allowed": false,\n                        "replan_required": true,\n                    })),\n                )\n                    .into_response();\n            }\n            Err(message) => {\n                return (\n                    StatusCode::CONFLICT,\n                    Json(serde_json::json!({\n                        "error": "windows_consequential_set_value_payload_rejected",\n                        "message": message,\n                        "action_id": action_id,\n                        "confirmation_consumed": true,\n                        "retry_allowed": false,\n                        "replan_required": true,\n                    })),\n                )\n                    .into_response();\n            }\n        }\n    } else {\n        None\n    };\n    drop(plan_gate);\n    debug_assert_eq!(peeked.queued.action.id, plan.queued.action.id);\n\n    let revalidator = ProcessLocalConfirmationAuthority::new(&plan);\n    if let Some(payload) = confirmed_set_value {\n        let authority = plan.queued.envelope.metadata.clone();\n        let target = plan.target.clone();\n        let result: Result<WindowsUiaVerifiedExecutionOutcome, String> = async {\n            let preflight = runtime\n                .preflight_uia_action(\n                    session_id,\n                    WindowsUiaActionPreflightRequest {\n                        authority: authority.clone(),\n                        element_ref: target.element_ref,\n                        required_pattern: target.required_pattern,\n                    },\n                )\n                .await\n                .map_err(|error| error.to_string())?;\n            let prepared = prepare_uia_dispatch(\n                &state.live,\n                control.journal.as_ref(),\n                runtime.as_ref(),\n                session_id,\n                WindowsUiaPreparedDispatchRequest {\n                    seal: WindowsUiaDispatchSealRequest {\n                        action_id,\n                        authority,\n                        preflight,\n                        context_requirements: target.context_requirements,\n                    },\n                },\n                &revalidator,\n            )\n            .await\n            .map_err(|error| error.to_string())?;\n            let armed = arm_uia_dispatch_execution(\n                &state.live,\n                control.journal.as_ref(),\n                runtime.as_ref(),\n                session_id,\n                prepared,\n            )\n            .await\n            .map_err(|error| error.to_string())?;\n            execute_armed_uia_set_value_dispatch(\n                &state.live,\n                control.journal.as_ref(),\n                runtime.as_ref(),\n                session_id,\n                armed,\n                WindowsUiaSetValueExecutionPayload {\n                    payload_ref: payload.payload_ref(),\n                    mode: payload.mode(),\n                    utf8_bytes: payload.utf8_bytes(),\n                },\n                &executor,\n            )\n            .await\n            .map_err(|error| error.to_string())\n        }\n        .await;\n\n        return match result {\n            Ok(outcome) => verified_outcome_response(outcome),\n            Err(message) => {\n                let reconciliation_required = control\n                    .journal\n                    .requires_reconciliation(action_id)\n                    .await\n                    .unwrap_or(false);\n                (\n                    StatusCode::CONFLICT,\n                    Json(serde_json::json!({\n                        "error": "windows_consequential_verified_set_value_execution_failed",\n                        "message": message,\n                        "action_id": action_id,\n                        "confirmation_consumed": true,\n                        "retry_allowed": false,\n                        "replan_required": !reconciliation_required,\n                        "reconciliation_required": reconciliation_required,\n                    })),\n                )\n                    .into_response()\n            }\n        };\n    }\n\n    let verifier = WindowsUiaSemanticPostconditionVerifier;\n    match execute_verified_canonical_uia_action(\n        &state.live,\n        control.journal.as_ref(),\n        runtime.as_ref(),\n        &plan.queued,\n        plan.target,\n        &revalidator,\n        &executor,\n        &verifier,\n    )\n    .await\n    {\n        Ok(outcome) => verified_outcome_response(outcome),\n        Err(error) => {\n            let reconciliation_required = control\n                .journal\n                .requires_reconciliation(action_id)\n                .await\n                .unwrap_or(false);\n            (\n                StatusCode::CONFLICT,\n                Json(serde_json::json!({\n                    "error": "windows_consequential_verified_execution_failed",\n                    "message": error.to_string(),\n                    "action_id": action_id,\n                    "confirmation_consumed": true,\n                    "retry_allowed": false,\n                    "replan_required": !reconciliation_required,\n                    "reconciliation_required": reconciliation_required,\n                })),\n            )\n                .into_response()\n        }\n    }\n}\n'''
          text = text[:start] + replacement + text[end:]
          parent.write_text(text, encoding='utf-8')
      - name: Format and verify exact production scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/control/src/windows_consequential.rs\ncrates/control/src/windows_consequential/set_value_http.rs'
          test "$changed" = "$expected"
          git diff -- crates/control/src/windows_consequential.rs crates/control/src/windows_consequential/set_value_http.rs
      - name: Compile and lint focused control authority
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p localview-control
          cargo clippy -p localview-control --all-targets -- -D warnings
      - name: Commit Stage 4 production GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'localview-ci'
          git config user.email 'localview-ci@users.noreply.github.com'
          git add crates/control/src/windows_consequential.rs crates/control/src/windows_consequential/set_value_http.rs
          git commit -m 'feat(v43): execute confirmed SetValue through verified path'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

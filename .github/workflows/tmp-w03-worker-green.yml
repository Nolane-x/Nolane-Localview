name: Temporary W03 Worker GREEN

# One-shot branch-local runner: this commit intentionally retriggers the workflow now that the workflow file already exists on the branch.
on:
  push:
    branches:
      - feat/v43-l7-windows-w03-w04-w05-closure

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LOCALVIEW_UIA_SMOKE: "1"
      LOCALVIEW_UIA_EDGE_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-edge-seed\bin\Release\net8.0-windows\LocalView.WindowsUiaEdgeSeed.exe
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply deterministic W03 MTA patch
        run: python tools/dev/patch_w03_worker.py
      - name: Format patched Rust
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Normalize patched Rust formatting
        run: cargo fmt --all
      - name: Compile Windows UIA provider
        shell: pwsh
        run: |
          cargo check -p localview-windows-uia-provider 2>&1 | Tee-Object -FilePath w03-cargo-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish W03 compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-cargo-check-${{ github.sha }}
          path: w03-cargo-check.txt
          if-no-files-found: error
      - name: Build WPF edge seed
        run: dotnet build tools/provider-seeds/windows-uia-edge-seed/LocalView.WindowsUiaEdgeSeed.csproj -c Release --nologo
      - name: W03 real provider GREEN proof on patched tree
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w03::w03_virtualized_item_requires_realize_then_fresh_observation"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w03 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W03 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w03 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Commit GREEN implementation and remove one-shot patcher
        shell: pwsh
        run: |
          Remove-Item tools/dev/patch_w03_worker.py
          Remove-Item .github/workflows/tmp-w03-worker-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-uia-provider/src/lib.rs crates/windows-uia-provider/src/virtualized_item.rs tools/dev/patch_w03_worker.py .github/workflows/tmp-w03-worker-green.yml
          git diff --cached --check
          git commit -m "feat(v43): add bounded UIA virtualized-item realization primitive"
          git push origin HEAD:feat/v43-l7-windows-w03-w04-w05-closure

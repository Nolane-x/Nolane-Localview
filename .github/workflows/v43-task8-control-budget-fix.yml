name: V4.3 Task 8 Control Budget Fix

on:
  pull_request:
    paths:
      - '.github/workflows/v43-task8-control-budget-fix.yml'

permissions:
  contents: write

jobs:
  patch-control-budget:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Align exact Windows UIA control fixture budget
        shell: python
        run: |
          from pathlib import Path

          expected = Path('crates/control/tests/windows_consequential_expand_collapse_windows_smoke.rs')
          roots = [
              Path('crates/windows-uia-provider/tests'),
              Path('crates/windows-observe-runtime/tests'),
              Path('crates/control/tests'),
          ]
          stale = []
          for root in roots:
              for path in root.rglob('*.rs'):
                  text = path.read_text(encoding='utf-8')
                  if '32 bounded nodes × 17 tracked properties per semantic node.' in text or 'max_properties: 544,' in text:
                      stale.append(path)

          unique = sorted(set(stale))
          if unique != [expected]:
              raise SystemExit(f'unexpected stale 17-property/544 fixtures: {[str(p) for p in unique]}')

          text = expected.read_text(encoding='utf-8')
          old = '''                        // Keep the property ceiling aligned with the explicit node ceiling:\n                        // 32 bounded nodes × 17 tracked properties per semantic node.\n                        max_properties: 544,\n'''
          new = '''                        // Keep the property ceiling aligned with the explicit node ceiling:\n                        // 32 bounded nodes × 19 tracked properties per semantic node.\n                        max_properties: 608,\n'''
          if text.count(old) != 1:
              raise SystemExit('exact stale control-budget anchor was not unique')
          expected.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify single-file patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -- crates/control/tests/windows_consequential_expand_collapse_windows_smoke.rs
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/control/tests/windows_consequential_expand_collapse_windows_smoke.rs"
          ! grep -R -n -E 'max_properties: 544|32 bounded nodes × 17 tracked properties' crates/windows-uia-provider/tests crates/windows-observe-runtime/tests crates/control/tests
          git diff -- crates/control/tests/windows_consequential_expand_collapse_windows_smoke.rs
      - name: Commit exact fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'localview-ci'
          git config user.email 'localview-ci@users.noreply.github.com'
          git add crates/control/tests/windows_consequential_expand_collapse_windows_smoke.rs
          git commit -m 'test(v43): align HTTP ExpandCollapse budget with safety facts'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: Desktop release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localview-desktop-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux Tauri dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Sidecar production contract
        run: cargo test -p localview-desktop --test daemon_sidecar_contract

      - name: Build Tauri bundle with bundled daemon
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Verify bundle output exists
        shell: bash
        run: |
          test -d target/release/bundle
          find target/release/bundle -type f -maxdepth 4 -print | tee bundle-files.txt
          test -s bundle-files.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localview-desktop-${{ matrix.name }}-${{ github.sha }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

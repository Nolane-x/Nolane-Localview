name: V4.3 Close Raw Input Bypass Once

on:
  push:
    branches:
      - feat/v43-l7-windows-w07-w08-w09-input-authority
    paths:
      - .github/workflows/v43-close-raw-input-bypass-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-l7-windows-w07-w08-w09-input-authority
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Transform source to authority-only Windows input path
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v43_close_raw_input_bypass.py
          rustfmt --edition 2024 \
            crates/windows-uia-provider/src/event_buffer_lib.rs \
            crates/windows-uia-provider/src/verified_input_windows.rs \
            crates/windows-uia-provider/tests/windows_verified_input_backend_contract.rs \
            tools/validation-lab/windows-l7-real-provider-harness/tests/support/v43_verified_input_full_smoke.rs \
            tools/validation-lab/windows-l7-real-provider-harness/tests/support/v43_verified_input_cases.rs \
            tools/validation-lab/windows-l7-real-provider-harness/tests/v43_real_provider_w08.rs
          cargo test -p localview-windows-uia-provider --test verified_input_authority_binding_contract -- --nocapture
          cargo check -p localview-windows-uia-provider
          test ! -e crates/windows-uia-provider/tests/windows_verified_input_smoke.rs
          ! grep -Fq 'pub fn windows_insert_verified_key_events(' crates/windows-uia-provider/src/verified_input_windows.rs
          ! grep -Fq 'pub use verified_input_windows::*;' crates/windows-uia-provider/src/event_buffer_lib.rs
          ! grep -R -F 'windows_insert_verified_key_events' tools/validation-lab/windows-l7-real-provider-harness crates/windows-uia-provider/tests
          git diff --check
      - name: Commit source-only closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/windows-uia-provider/src/event_buffer_lib.rs \
            crates/windows-uia-provider/src/verified_input_windows.rs \
            crates/windows-uia-provider/tests/windows_verified_input_backend_contract.rs \
            crates/windows-uia-provider/tests/windows_verified_input_smoke.rs \
            tools/validation-lab/windows-l7-real-provider-harness/tests/support/v43_verified_input_full_smoke.rs \
            tools/validation-lab/windows-l7-real-provider-harness/tests/support/v43_verified_input_cases.rs \
            tools/validation-lab/windows-l7-real-provider-harness/tests/v43_real_provider_w08.rs \
            docs/superpowers/plans/2026-09-12-v43-windows-verified-input-w07-w08-w09.md
          git diff --cached --quiet && { echo "expected source changes missing"; exit 1; }
          git commit -m "fix(v43): close raw Windows input bypass"
          git push origin HEAD:feat/v43-l7-windows-w07-w08-w09-input-authority

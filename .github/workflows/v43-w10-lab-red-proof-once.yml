name: V4.3 W10 Geometry RED Proof Once

on:
  push:
    branches: [feat/v43-l7-windows-w10-mixed-dpi-authority]
    paths:
      - .github/workflows/v43-w10-lab-red-proof-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove typed W10 geometry contracts are absent
        run: cargo test -p localview-windows-uia-provider --test geometry_contract -- --nocapture

name: V4.3 W10 Geometry GREEN Proof Once

on:
  push:
    branches: [feat/v43-l7-windows-w10-mixed-dpi-authority]
    paths:
      - .github/workflows/v43-w10-lab-red-proof-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify typed W10 geometry contracts
        run: cargo test -p localview-windows-uia-provider --test geometry_contract -- --nocapture
      - name: Verify full Windows UIA provider pure regression suite
        run: cargo test -p localview-windows-uia-provider -- --nocapture

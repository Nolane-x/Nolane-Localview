name: V4.3 L04 Event Reconciliation Contract

on:
  pull_request:
    paths:
      - 'crates/linux-atspi-provider/**'
      - '.github/workflows/v43-l04-contract.yml'
  push:
    branches: [main]
    paths:
      - 'crates/linux-atspi-provider/**'
      - '.github/workflows/v43-l04-contract.yml'

permissions:
  contents: read

jobs:
  linux-l04-event-reconciliation:
    name: Linux L04 missed event requires direct reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Verify L04 test registration
        shell: bash
        run: |
          set -euo pipefail
          listed="$(cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l04_event_reconciliation_contract -- --list)"
          grep -F 'toolkit_sensitive_event_profile_requires_direct_reconciliation: test' <<<"$listed"
          grep -F 'missed_event_cache_cannot_mint_action_authority: test' <<<"$listed"
          grep -F 'direct_reconciliation_mints_fresh_revision_without_mutating_old_cache: test' <<<"$listed"
          grep -F 'fresh_direct_reconciliation_can_mint_authority_bound_to_new_cut: test' <<<"$listed"
          grep -F 'reconciled_observation_cannot_cross_binding_or_mix_cuts: test' <<<"$listed"
          grep -F 'shipping_reconciliation_requires_live_atspi_observation: test' <<<"$listed"
      - name: Run Linux L04 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l04_event_reconciliation_contract -- --nocapture --test-threads=1
      - name: Retain Linux L01 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l01_defunct_binding_contract -- --nocapture --test-threads=1
      - name: Retain Linux L02 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l02_defunct_recreate_contract -- --nocapture --test-threads=1
      - name: Retain Linux L03 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l03_visible_occlusion_contract -- --nocapture --test-threads=1
      - name: Clippy Linux AT-SPI provider with validation feature
        run: cargo clippy -p localview-linux-atspi-provider --features validation-state-injection --all-targets -- -D warnings

name: Wave 2 Task 4 red-green gate

on:
  push:
    branches:
      - feat/guarded-full-page-stitching-impl
    paths:
      - .github/workflows/wave2-task4-tdd.yml

permissions:
  contents: write

jobs:
  task4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guarded-full-page-stitching-impl
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify RED
        shell: bash
        run: |
          set +e
          cargo test -p localview-control --test full_page_capture_control -- --nocapture 2>&1 | tee /tmp/task4-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "full_page_capture_control" /tmp/task4-red.log || grep -q "full_page_freeze_returns_only_bounded_extended_receipt" /tmp/task4-red.log
          grep -q "FAILED\|failed" /tmp/task4-red.log
      - name: Apply Task 4 implementation
        run: python scripts/wave2_task4_patch.py
      - name: Verify GREEN
        run: |
          git diff --check
          cargo test -p localview-control --test full_page_capture_control -- --nocapture
          cargo test -p localview-control --test capture_visual_state
          cargo test -p localview-control --test public_action_authority
          cargo check -p localview-control --all-targets
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/control/src/capture_settle.rs crates/control/src/runtime.rs
          git diff --cached --check
          git commit -m "feat(control): add guarded full-page capture endpoints"
          git push origin HEAD:feat/guarded-full-page-stitching-impl

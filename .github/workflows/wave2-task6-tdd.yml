name: Wave 2 Task 6 red-green gate

on:
  push:
    branches:
      - feat/guarded-full-page-stitching-impl
    paths:
      - .github/workflows/wave2-task6-tdd.yml

permissions:
  contents: write

jobs:
  task6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guarded-full-page-stitching-impl
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify RED
        shell: bash
        run: |
          set +e
          cargo test -p localview-desktop --test full_page_capture_contract -- --nocapture 2>&1 | tee /tmp/task6-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "desktop_full_page_transaction_is_single_gate_restore_before_persistence\|full_page_cleanup_restores_scroll_before_visual_state\|tauri_registers_explicit_full_page_command" /tmp/task6-red.log
          grep -q "FAILED\|failed" /tmp/task6-red.log
      - name: Apply Task 6 implementation
        run: python scripts/wave2_task6_patch.py
      - name: Verify GREEN
        run: |
          git diff --check
          cargo test -p localview-desktop --test full_page_capture_contract -- --nocapture
          cargo test -p localview-desktop --test full_page_page_executor_contract -- --nocapture
          cargo test -p localview-desktop --test visual_freeze_capture_contract -- --nocapture
          cargo check -p localview-desktop --all-targets
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/visual_capture.rs apps/desktop/src-tauri/src/lib.rs
          git diff --cached --check
          git commit -m "feat(desktop): orchestrate guarded full-page stitching"
          git push origin HEAD:feat/guarded-full-page-stitching-impl

name: V4.3 UIA Dispatch Green Builder v4

on:
  push:
    branches: [feat/v43-windows-uia-real-pattern-dispatch]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-uia-real-pattern-dispatch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reuse validated structural worker patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/v43-uia-dispatch-green-v3.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(y) if l.strip()=="python - <<'PY'")+1
          end=next(i for i in range(start,len(y)) if y[i].strip()=='PY')
          script='\n'.join(l[10:] if l.startswith('          ') else l for l in y[start:end])
          exec(compile(script,'v3-structural-patch','exec'))
          PY
      - name: Expose dispatch through canonical event worker facade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['subscription.rs','subscription_stub.rs']:
              p=Path('crates/windows-uia-provider/src')/filename
              s=p.read_text(encoding='utf-8')
              old='''    WindowsUiaBoundDispatchContextReceipt, WindowsUiaDispatchContextRequest, WindowsUiaEventDrain,
          '''
              new='''    WindowsUiaBoundDispatchContextReceipt, WindowsUiaDispatchContextRequest, WindowsUiaEventDrain,
              WindowsUiaPatternDispatchReceipt, WindowsUiaPatternDispatchRequest,
          '''
              if s.count(old)!=1: raise SystemExit(f'{filename}: import anchor mismatch')
              s=s.replace(old,new,1)
              marker='''        pub fn subscribe_events(
          '''
              wrapper='''        pub fn dispatch_pattern(
                  &self,
                  attachment: &WindowsUiaAttachment,
                  request: WindowsUiaPatternDispatchRequest,
              ) -> Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
                  self.inner.dispatch_pattern(attachment, request)
              }
          
          '''
              if s.count(marker)!=1: raise SystemExit(f'{filename}: subscribe anchor mismatch')
              s=s.replace(marker,wrapper+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compile provider and all targets
        run: cargo check -p localview-windows-uia-provider --all-targets
      - name: Test provider contracts
        run: cargo test -p localview-windows-uia-provider
      - name: Commit validated production patch
        shell: bash
        run: |
          rm -f .github/workflows/v43-uia-dispatch-green.yml .github/workflows/v43-uia-dispatch-green-v2.yml .github/workflows/v43-uia-dispatch-green-v3.yml .github/workflows/v43-uia-dispatch-green-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-uia-provider .github/workflows
          git commit -m "feat(windows-uia): dispatch retained Invoke pattern atomically"
          git push origin HEAD:feat/v43-windows-uia-real-pattern-dispatch

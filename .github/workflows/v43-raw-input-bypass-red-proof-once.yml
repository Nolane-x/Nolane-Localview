name: V4.3 Raw Input Bypass RED Proof Once

on:
  push:
    branches:
      - feat/v43-l7-windows-w07-w08-w09-input-authority
    paths:
      - .github/workflows/v43-raw-input-bypass-red-proof-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-visibility-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove public raw SendInput bypass is rejected
        run: cargo test -p localview-windows-uia-provider --test verified_input_authority_binding_contract raw_windows_sendinput_backend_is_not_publicly_reexported -- --exact --nocapture

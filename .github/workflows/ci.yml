name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: localview-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native capture system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize formatting for compiler gate
        run: cargo fmt --all
      - name: Formatting diff summary
        shell: bash
        run: git diff --stat || true
      - name: Check core workspace
        run: cargo check --workspace --exclude localview-desktop --all-targets
      - name: Clippy
        run: cargo clippy --workspace --exclude localview-desktop --all-targets -- -D warnings
      - name: Stable capture network idle contract
        run: cargo test -p localview-capture --test settle_contract
      - name: Instrumentation network in-flight contract
        run: cargo test -p localview-instrumentation --test network_inflight_contract
      - name: Control network idle projection contract
        run: cargo test -p localview-control --test network_inflight_settle_contract
      - name: Bridge action cancellation authority contract
        run: cargo test -p localview-live-bridge --test action_cancellation
      - name: Bridge action cancellation control contract
        run: cargo test -p localview-control --test action_cancellation
      - name: Native executor cancellation lifecycle hardening
        run: cargo test -p localview-live-bridge --test native_executor_cancellation_hardening
      - name: Native executor cancellation control hardening
        run: cargo test -p localview-control --test native_executor_cancellation_hardening
      - name: Native visual timeout cancellation contract
        run: cargo test -p localview-control --test native_visual_timeout_cancellation
      - name: Native executor exact result lookup contract
        run: cargo test -p localview-live-bridge --test native_executor_exact_result_lookup_contract
      - name: Tests
        run: cargo test --workspace --exclude localview-desktop
      - name: Native executor queue contract
        run: cargo test -p localview-live-bridge --test native_executor_queue
      - name: Native executor transport contract
        run: cargo test -p localview-control --test native_executor_transport
      - name: Native executor cancellation authority contract
        run: cargo test -p localview-control --test native_executor_cancellation
      - name: Progressive semantic target resolver contract
        run: cargo test -p localview-capture --test progressive_target_resolution
      - name: Fresh semantic snapshot control contract
        run: cargo test -p localview-control --test fresh_semantic_snapshot
      - name: Native capture platform contract
        run: cargo test -p localview-native-capture
      - name: Token-aware visual packet policy contract
        run: cargo test -p localview-token-budget --test visual_packet_selection
      - name: Perception budget contract
        run: cargo test -p localview-token-budget --test perception_budget_contract
      - name: Planner-owned perception budget authority
        run: cargo test -p localview-planner --test perception_budget_authority
      - name: Tier-3 perception authority contract
        run: cargo test -p localview-engine --test tier3_perception_authority
      - name: Live perception planning contract
        run: cargo test -p localview-control --test live_perception_plan
      - name: Live perception execution contract
        run: cargo test -p localview-control --test live_perception_execution
      - name: Retained perception feedback contract
        run: cargo test -p localview-control --test perception_retained_feedback_loop
      - name: Whole-cycle perception budget contract
        run: cargo test -p localview-control --test perception_cycle_budget
      - name: Native visual perception cycle contract
        run: cargo test -p localview-control --test native_visual_perception_cycle
      - name: Native visual evidence correlation contract
        run: cargo test -p localview-control --test native_visual_evidence_correlation
      - name: Native visual diff evidence contract
        run: cargo test -p localview-control --test visual_diff_evidence
      - name: Live visual verification contract
        run: cargo test -p localview-control --test live_visual_verification
      - name: Live visual capture verification contract
        run: cargo test -p localview-control --test live_visual_capture_verify
      - name: Live visual capture resource governor contract
        run: cargo test -p localview-control --test live_visual_capture_resource_governor
      - name: Runtime resource governor authority contract
        run: cargo test -p localview-control --test runtime_resource_governor
      - name: Process resource telemetry contract
        run: cargo test -p localview-resource-governor --test process_metrics
      - name: Tier-3 Chromium executable discovery contract
        run: cargo test -p localview-chromium --test executable_discovery
      - name: Tier-3 Chromium process executor contract
        run: cargo test -p localview-chromium --test executor_contract
      - name: Tier-3 Chromium rendered-pixel executor contract
        run: cargo test -p localview-chromium --test rendered_pixel_contract
      - name: Tier-3 Chromium perception cycle contract
        run: |
          cargo test -p localview-control --test chromium_perception_cycle
          cargo test -p localview-control --test chromium_evidence_freshness

  native-gui-smoke-linux:
    name: Native GUI smoke (WebKitGTK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK GUI smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real WebKitGTK rendered-pixel smoke
        env:
          LOCALVIEW_GUI_SMOKE: "1"
        run: xvfb-run -a cargo test -p localview-native-capture webkitgtk_visible_snapshot_returns_real_rendered_pixels -- --ignored --nocapture

  native-gui-smoke-macos:
    name: Native GUI smoke (WKWebView)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real WKWebView rendered-pixel smoke
        env:
          LOCALVIEW_GUI_SMOKE: "1"
        run: cargo test -p localview-native-capture --features gui-smoke --test macos_gui_smoke

  native-gui-smoke-windows:
    name: Native GUI smoke (WebView2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real WebView2 rendered-pixel smoke
        env:
          LOCALVIEW_GUI_SMOKE: "1"
        run: cargo test -p localview-native-capture --features gui-smoke --test windows_gui_smoke

  desktop-linux:
    name: Tauri + frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check stable Tauri backend
        run: cargo check -p localview-desktop
      - name: Check native workspace backend
        run: cargo check -p localview-desktop --features native-workspace
      - name: Desktop capability regression tests
        run: cargo test -p localview-desktop --test capability_isolation
      - name: Workspace surface policy contract
        run: cargo test -p localview-desktop --test workspace_surface_policy
      - name: Live semantic bridge contract
        run: cargo test -p localview-desktop --test live_semantic_bridge_contract
      - name: Bridge action cancellation worker contract
        run: cargo test -p localview-desktop --test action_cancellation_worker_contract
      - name: Native visual capture desktop contract
        run: cargo test -p localview-desktop --test native_capture_contract
      - name: Stable capture settle desktop contract
        run: cargo test -p localview-desktop --test stable_capture_settle_contract
      - name: Visual freeze capture transaction contract
        run: cargo test -p localview-desktop --test visual_freeze_capture_contract
      - name: Changed-region scheduling transaction contract
        run: cargo test -p localview-desktop --test changed_region_schedule_contract
      - name: Changed visual diff publication contract
        run: cargo test -p localview-desktop --test changed_visual_diff_publication_contract
      - name: Progressive target capture contract
        run: cargo test -p localview-desktop --test progressive_target_capture_contract
      - name: Visual packet capture contract
        run: cargo test -p localview-desktop --test visual_packet_capture_contract
      - name: Perception budget capture contract
        run: cargo test -p localview-desktop --test perception_budget_capture_contract
      - name: Perception budget authorization contract
        run: cargo test -p localview-desktop --test perception_budget_authorization_contract
      - name: Native visual executor worker contract
        run: cargo test -p localview-desktop --test native_visual_executor_worker_contract
      - name: Native visual diff executor contract
        run: cargo test -p localview-desktop --test native_visual_diff_executor_contract
      - name: Native executor cancellation worker contract
        run: cargo test -p localview-desktop --test native_executor_cancellation_worker_contract
      - name: Native executor exact cancellation lookup contract
        run: cargo test -p localview-desktop --test native_executor_cancellation_lookup_contract

name: Wave 3 causal correlation foundation

on:
  push:
    paths:
      - 'crates/causal/**'
      - 'docs/superpowers/specs/2026-09-19-wave3-action-request-ui-correlation-design.md'
      - '.github/workflows/wave3-causal-correlation.yml'
  pull_request:
    paths:
      - 'crates/causal/**'
      - 'docs/superpowers/specs/2026-09-19-wave3-action-request-ui-correlation-design.md'
      - '.github/workflows/wave3-causal-correlation.yml'

concurrency:
  group: wave3-causal-correlation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Action request UI correlation contract
        run: cargo test -p localview-causal --test action_request_ui_correlation -- --nocapture
      - name: Causal crate regressions
        run: cargo test -p localview-causal
      - name: Workspace check
        run: cargo check --workspace --all-targets

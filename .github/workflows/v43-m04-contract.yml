name: V4.3 M04 Cannot Complete Contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: localview-v43-m04-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m04-cannot-complete-contract:
    name: M04 AX cannot-complete authority contract
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run macOS AX provider contracts through M04
        run: cargo test -p localview-macos-ax-provider -- --nocapture

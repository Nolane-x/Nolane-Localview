name: V4.3 M08 Real Provider Seed

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: localview-v43-m08-real-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m08-real-provider:
    name: M08 real permission separation
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      LOCALVIEW_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/macos-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Bind exact M08 candidate and artifact directory
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$LOCALVIEW_CANDIDATE_SHA"
          artifact_dir="$RUNNER_TEMP/localview-v43-m08"
          mkdir -p "$artifact_dir"
          echo "LOCALVIEW_L7_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
      - name: Require exact M08 real-provider registration
        run: |
          set -euo pipefail
          test_name="macos_real_provider_m08::m08_visual_and_ax_permissions_are_independently_os_observed"
          listed="$(cargo test --manifest-path "$LOCALVIEW_L7_HARNESS_MANIFEST" --test v43_real_provider_m08 -- --list)"
          printf '%s\n' "$listed" | grep -F "${test_name}: test"
      - name: Run M08 real permission-separation oracle
        run: |
          set -euo pipefail
          test_name="macos_real_provider_m08::m08_visual_and_ax_permissions_are_independently_os_observed"
          cargo test --manifest-path "$LOCALVIEW_L7_HARNESS_MANIFEST" --test v43_real_provider_m08 "$test_name" -- --ignored --exact --nocapture --test-threads=1
      - name: Verify M08 evidence is exact-head and cross-authority-safe
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCALVIEW_CANDIDATE_SHA"
          record_path="$LOCALVIEW_L7_ARTIFACT_DIR/M08-REAL-PROVIDER-RECORD.json"
          test -f "$record_path"
          python3 - "$record_path" "$LOCALVIEW_CANDIDATE_SHA" <<'PY'
          import json, sys
          path, expected_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              record = json.load(handle)

          assert record["schema"] == "localview-v43-m08-real-provider-record-v1"
          assert record["case_id"] == "M08"
          assert record["candidate_sha"] == expected_sha
          assert record["visual_authority_source"] == "coregraphics_preflight"
          assert record["ax_authority_source"] == "accessibility_provider_live_observation"
          assert record["cross_authority_inference_used"] is False
          assert record["visual_permission_check_sequence"] > 0
          assert record["ax_permission_check_sequence"] > 0

          visual_granted = record["direct_visual_preflight_granted"]
          expected_visual_state = "granted" if visual_granted else "denied"
          assert record["visual_permission_state"] == expected_visual_state
          assert record["visual_permit_minted"] is visual_granted

          ax_state = record["ax_permission_state"]
          assert ax_state in {"trusted", "untrusted", "unknown"}
          assert record["ax_semantic_permit_minted"] is (ax_state == "trusted")
          PY
      - name: Publish M08 real-provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v43-m08-real-provider-${{ env.LOCALVIEW_CANDIDATE_SHA }}
          path: ${{ env.LOCALVIEW_L7_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30

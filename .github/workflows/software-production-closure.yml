name: Software production closure truth

on:
  pull_request:
    paths:
      - "README*.md"
      - "docs/SECURITY.md"
      - "docs/PRODUCTION_CLOSURE_MATRIX.md"
      - "docs/IMPLEMENTATION_STATUS.md"
      - "docs/PRODUCTION_RELEASE.md"
      - "docs/SPEC_COVERAGE.md"
      - "docs/ROADMAP.md"
      - "docs/releases/**"
      - "release-policy.json"
      - "release-candidate.json"
      - "tools/release/**"
      - "apps/desktop/**"
      - "apps/daemon/**"
      - "crates/control/**"
      - "crates/live-bridge/**"
      - "crates/verification/**"
      - "crates/counterfactual/**"
      - "crates/mutation/**"
      - "crates/contracts/**"
      - "crates/planner/**"
      - "crates/state-space/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/publish-release-candidate.yml"
      - ".github/workflows/software-production-closure.yml"
  push:
    branches: [main]
    paths:
      - "README*.md"
      - "docs/SECURITY.md"
      - "docs/PRODUCTION_CLOSURE_MATRIX.md"
      - "docs/IMPLEMENTATION_STATUS.md"
      - "docs/PRODUCTION_RELEASE.md"
      - "docs/SPEC_COVERAGE.md"
      - "docs/ROADMAP.md"
      - "docs/releases/**"
      - "release-policy.json"
      - "release-candidate.json"
      - "tools/release/**"
      - "apps/desktop/**"
      - "apps/daemon/**"
      - "crates/control/**"
      - "crates/live-bridge/**"
      - "crates/verification/**"
      - "crates/counterfactual/**"
      - "crates/mutation/**"
      - "crates/contracts/**"
      - "crates/planner/**"
      - "crates/state-space/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/publish-release-candidate.yml"
      - ".github/workflows/software-production-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localview-software-production-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closure-truth:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Syntax-check release verifiers
        run: |
          python3 -m py_compile tools/release/verify_production_closure_matrix.py
          python3 -m py_compile tools/release/verify_release_candidate_manifest.py
      - name: Verify bounded V1 production closure matrix
        run: python3 tools/release/verify_production_closure_matrix.py
      - name: Verify initial/future release policy
        run: python3 tools/release/verify_release_policy.py
      - name: Verify release candidate manifest
        run: python3 tools/release/verify_release_candidate_manifest.py
      - name: Negative proof — In progress status must fail closed
        shell: bash
        run: |
          cp docs/PRODUCTION_CLOSURE_MATRIX.md "$RUNNER_TEMP/production-matrix.md"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/PRODUCTION_CLOSURE_MATRIX.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = False
          for index, line in enumerate(lines):
              if line.startswith("| Update check/channel |"):
                  cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
                  if len(cells) != 4:
                      raise SystemExit("unexpected production matrix row shape")
                  cells[2] = "In progress"
                  lines[index] = "| " + " | ".join(cells) + " |"
                  changed = True
                  break
          if not changed:
              raise SystemExit("update check/channel row not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          set +e
          python3 tools/release/verify_production_closure_matrix.py
          rc=$?
          set -e
          cp "$RUNNER_TEMP/production-matrix.md" docs/PRODUCTION_CLOSURE_MATRIX.md
          test "$rc" -ne 0
      - name: Negative proof — missing repository evidence must fail closed
        shell: bash
        run: |
          mv apps/desktop/src-tauri/tests/update_channel_contract.rs "$RUNNER_TEMP/update_channel_contract.rs"
          set +e
          python3 tools/release/verify_production_closure_matrix.py
          rc=$?
          set -e
          mv "$RUNNER_TEMP/update_channel_contract.rs" apps/desktop/src-tauri/tests/update_channel_contract.rs
          test "$rc" -ne 0
      - name: Negative proof — stale public claim must fail closed
        shell: bash
        run: |
          cp README.md "$RUNNER_TEMP/README.md"
          printf '\ncanonical consequential DOM interaction authority\n' >> README.md
          set +e
          python3 tools/release/verify_production_closure_matrix.py
          rc=$?
          set -e
          cp "$RUNNER_TEMP/README.md" README.md
          test "$rc" -ne 0

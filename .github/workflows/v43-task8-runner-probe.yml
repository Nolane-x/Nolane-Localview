name: Task 8 Control State Wiring

on:
  push:
    branches:
      - feat/v43-windows-set-value-payload-authority

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-set-value-payload-authority
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/v43-task8-run-control-state.sh

name: V4.3 W11 Modal Fix Once

on:
  push:
    branches: [feat/v43-l7-windows-w11-w12-race-authority]
    paths:
      - .github/workflows/v43-w11-red-proof-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  w11-modal-fix:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LOCALVIEW_UIA_SMOKE: "1"
      LOCALVIEW_UIA_EDGE_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-edge-seed\bin\Release\net8.0-windows\LocalView.WindowsUiaEdgeSeed.exe
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-l7-windows-w11-w12-race-authority
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply minimal modal detector fix in runner
        shell: pwsh
        run: |
          $path = "crates/windows-uia-provider/src/lib.rs"
          $text = [System.IO.File]::ReadAllText($path)
          $oldImport = "GetForegroundWindow, GetLastActivePopup, GetWindowThreadProcessId, IsWindowVisible,"
          $newImport = "GetForegroundWindow, GetWindow, GetWindowThreadProcessId, IsWindowVisible, GW_ENABLEDPOPUP,"
          if (-not $text.Contains($oldImport)) {
            throw "expected GetLastActivePopup import not found"
          }
          $text = $text.Replace($oldImport, $newImport)
          $oldCall = "GetLastActivePopup(target_hwnd)"
          $newCall = "GetWindow(target_hwnd, GW_ENABLEDPOPUP)"
          if (-not $text.Contains($oldCall)) {
            throw "expected worker GetLastActivePopup call not found"
          }
          $text = $text.Replace($oldCall, $newCall)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- crates/windows-uia-provider/src/lib.rs
      - name: Build W11 WPF edge seed
        run: dotnet build tools/provider-seeds/windows-uia-edge-seed/LocalView.WindowsUiaEdgeSeed.csproj -c Release --nologo
      - name: Prove W11 GREEN on real Windows boundary
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w11::w11_modal_before_dispatch_is_blocked_before_any_real_input_effect"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w11 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W11 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w11 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Commit minimal production fix only after GREEN
        shell: pwsh
        run: |
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git add crates/windows-uia-provider/src/lib.rs
          if (git diff --cached --quiet) {
            throw "expected production modal detector diff is empty"
          }
          git commit -m "fix(v43): detect enabled owned modal before dispatch"
          git push origin HEAD:feat/v43-l7-windows-w11-w12-race-authority

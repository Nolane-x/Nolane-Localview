name: Windows UIA Observe

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: localview-uia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-uia-observe:
    name: Real Windows UIA observe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile isolated UIA provider
        run: cargo check -p localview-windows-uia-provider --all-targets
      - name: V4.3 SetValue move-only request contract
        run: cargo test -p localview-windows-uia-provider --test set_value_dispatch_contract -- --nocapture
      - name: V4.3 SetValue equality metadata contract
        run: cargo test -p localview-windows-uia-provider --test set_value_equality_contract -- --nocapture
      - name: V4.3 SetValue provider fresh equality contract
        run: cargo test -p localview-windows-uia-provider --test set_value_provider_verification_contract -- --nocapture
      - name: Phase 6 UIA action capability contract
        run: cargo test -p localview-windows-uia-provider --test action_capability_contract -- --nocapture
      - name: Phase 6 provider dispatch context fence contract
        run: cargo test -p localview-windows-uia-provider --test dispatch_context_contract -- --nocapture
      - name: Compile observe runtime manager
        run: cargo check -p localview-windows-observe-runtime --all-targets
      - name: V4.3 fresh action planning evidence contract
        run: cargo test -p localview-windows-observe-runtime --test fresh_action_evidence_contract -- --nocapture
      - name: V4.3 direct canonical action isolation
        run: cargo test -p localview-live-bridge --test v43_direct_canonical_action -- --nocapture
      - name: V4.3 durable pre-dispatch WAL crash boundary
        run: cargo test -p localview-live-bridge --test v43_consequential_journal -- --nocapture
      - name: V4.3 one-shot PREPARED dispatch capability
        run: cargo test -p localview-live-bridge --test v43_dispatch_capability -- --nocapture
      - name: Phase 6 UIA action capability preflight contract
        run: cargo test -p localview-windows-observe-runtime --test action_capability_preflight_contract -- --nocapture
      - name: V4.3 UIA preflight continuity reconciliation contract
        run: cargo test -p localview-windows-observe-runtime --test preflight_continuity_contract -- --nocapture
      - name: Phase 6 dispatch-time exact lease revalidation contract
        run: cargo test -p localview-windows-observe-runtime --test dispatch_revalidation_contract -- --nocapture
      - name: Phase 6 canonical dispatch authority + durable journal contract
        run: cargo test -p localview-windows-observe-runtime --test dispatch_authority_contract -- --nocapture
      - name: Phase 6 runtime dispatch seal contract
        run: cargo test -p localview-windows-observe-runtime --test dispatch_seal_contract -- --nocapture
      - name: Phase 6 sealed durable PREPARED dispatch boundary
        run: cargo test -p localview-windows-observe-runtime --test prepared_dispatch_contract -- --nocapture
      - name: Phase 6 PREPARED execution arm + second volatile context
        run: cargo test -p localview-windows-observe-runtime --test prepared_dispatch_contract execution_arm -- --nocapture
      - name: Phase 6 one-shot provider dispatch outcome coordinator
        run: cargo test -p localview-windows-observe-runtime --test execution_coordinator_behavior -- --nocapture
      - name: V4.3 SetValue production runtime adapter contract
        run: cargo test -p localview-windows-observe-runtime --test set_value_runtime_provider_adapter_contract -- --nocapture
      - name: V4.3 SetValue fresh equality execution contract
        run: cargo test -p localview-windows-observe-runtime --test set_value_execution_contract -- --nocapture
      - name: Phase 5 resource accounting and governor contract
        run: cargo test -p localview-windows-observe-runtime --test resource_accounting_contract -- --nocapture
      - name: Phase 6 read-only semantic action contract
        run: cargo test -p localview-windows-observe-runtime --test read_only_semantic_action_contract -- --nocapture
      - name: V4.3 runtime-owned post-dispatch capture contract
        run: cargo test -p localview-windows-observe-runtime --test postcondition_capture_contract -- --nocapture
      - name: V4.3 consequential HTTP boundary contract
        run: cargo test -p localview-control --test windows_consequential_control -- --nocapture
      - name: V4.3 ExpandCollapse server-owned HTTP routes
        run: cargo test -p localview-control --test windows_consequential_expand_collapse_control -- --nocapture
      - name: Real Win32 UIA snapshot + exact element lease lifetime
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test windows_uia_smoke -- --ignored --nocapture
      - name: Real Win32 dispatch context + exact focused element fence
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test dispatch_context_worker_smoke -- --ignored --nocapture
      - name: Real retained Win32 UIA Invoke dispatch
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test pattern_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Real retained Win32 UIA SelectionItem dispatch
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test selection_item_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Real retained Win32 UIA Toggle dispatch
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test toggle_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Real retained Win32 UIA Expand state observation
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test expand_collapse_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Real retained Win32 UIA SetValue + fresh CurrentValue equality
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test set_value_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Real retained Invoke to verified post-dispatch commit
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-observe-runtime --test windows_runtime_dispatch_smoke -- --ignored --nocapture --test-threads=1
      - name: Real HTTP plan + confirm to verified durable Invoke commit
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-control --test windows_consequential_control_windows_smoke -- --ignored --nocapture --test-threads=1
      - name: Real HTTP plan + confirm to verified durable SelectionItem commit
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-control --test windows_consequential_selection_windows_smoke -- --ignored --nocapture --test-threads=1
      - name: Real HTTP plan + confirm to verified durable Toggle commit
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-control --test windows_consequential_toggle_windows_smoke -- --ignored --nocapture --test-threads=1
      - name: Real HTTP Expand then Collapse with verified durable commits
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-control --test windows_consequential_expand_collapse_windows_smoke -- --ignored --nocapture --test-threads=1
      - name: Real bounded Win32 UIA event subscription
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test windows_uia_event_smoke -- --ignored --nocapture
      - name: Real Win32 UIA runtime manager
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-observe-runtime --test windows_runtime_smoke -- --ignored --nocapture
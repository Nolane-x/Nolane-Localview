name: TEMP L05 zbus compatibility patch

on:
  push:
    branches:
      - wip/v43-l05-zbus-compat-fix

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/v43-l05-zbus-compat-fix
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Apply exact zbus 5.13-compatible liveness patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/linux-atspi-provider/src/provider.rs")
          text = path.read_text()

          refresh = "        self.refresh_closed_transport_state();\n"
          count = text.count(refresh)
          if count != 6:
              raise SystemExit(f"expected 6 refresh calls, found {count}")
          text = text.replace(refresh, "")

          old = "        let connection = self.connection_for_live_authority()?;\n"
          if text.count(old) != 1:
              raise SystemExit("expected one reconcile live-connection call")
          text = text.replace(old, "        let connection = self.connection_for_live_authority().await?;\n")

          old = "        let connection = self\n            .connection_for_live_authority()\n            .map_err(AtspiPointerEligibilityError::Semantic)?;\n"
          new = "        let connection = self\n            .connection_for_live_authority()\n            .await\n            .map_err(AtspiPointerEligibilityError::Semantic)?;\n"
          if text.count(old) != 1:
              raise SystemExit("expected one pointer live-connection call")
          text = text.replace(old, new)

          start = text.index("    fn refresh_closed_transport_state(&self) {\n")
          end = text.index("    fn observation_transport_error(&self) -> AtspiActionEligibilityError {\n")
          lines = [
              "    async fn connection_for_live_authority(",
              "        &self,",
              "    ) -> Result<AccessibilityConnection, AtspiActionEligibilityError> {",
              "        let (bus_incarnation, connection) = {",
              "            let bus = self",
              "                .accessibility_bus",
              "                .lock()",
              "                .expect(\"AT-SPI accessibility bus mutex poisoned\");",
              "            if bus.lifecycle == AtspiAccessibilityBusLifecycle::Disconnected {",
              "                return Err(AtspiActionEligibilityError::AccessibilityBusDisconnected);",
              "            }",
              "            let connection = bus",
              "                .connection",
              "                .clone()",
              "                .ok_or(AtspiActionEligibilityError::ObservationUnavailable)?;",
              "            (bus.incarnation_ref, connection)",
              "        };",
              "",
              "        // zbus 5.13.x (resolved by atspi 0.30 on Rust 1.85) predates",
              "        // Connection::is_closed(). Probe the message bus itself through",
              "        // the standard org.freedesktop.DBus GetId method instead.",
              "        let probe = connection",
              "            .connection()",
              "            .call_method(",
              "                Some(\"org.freedesktop.DBus\"),",
              "                \"/org/freedesktop/DBus\",",
              "                Some(\"org.freedesktop.DBus\"),",
              "                \"GetId\",",
              "                &(),",
              "            )",
              "            .await;",
              "        if probe.is_err() {",
              "            let mut bus = self",
              "                .accessibility_bus",
              "                .lock()",
              "                .expect(\"AT-SPI accessibility bus mutex poisoned\");",
              "            if bus.lifecycle == AtspiAccessibilityBusLifecycle::Connected",
              "                && bus.incarnation_ref == bus_incarnation",
              "            {",
              "                bus.lifecycle = AtspiAccessibilityBusLifecycle::Disconnected;",
              "                bus.connection = None;",
              "            }",
              "            return Err(AtspiActionEligibilityError::AccessibilityBusDisconnected);",
              "        }",
              "",
              "        Ok(connection)",
              "    }",
              "",
          ]
          replacement = "\n".join(lines) + "\n"
          text = text[:start] + replacement + text[end:]

          if "is_closed()" in text:
              raise SystemExit("zbus is_closed call survived compatibility patch")
          if "refresh_closed_transport_state" in text:
              raise SystemExit("obsolete sync transport refresh survived patch")
          path.write_text(text)
          PY
          rm .github/workflows/tmp-l05-zbus-compat-patch.yml
      - name: Format Linux provider
        run: cargo +1.85.0 fmt -p localview-linux-atspi-provider
      - name: Compile Linux provider and L05 contract on Rust 1.85
        run: cargo +1.85.0 check -p localview-linux-atspi-provider --features validation-state-injection --tests
      - name: Commit verified staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/linux-atspi-provider/src/provider.rs .github/workflows/tmp-l05-zbus-compat-patch.yml
          git diff --cached --check
          git commit -m 'fix(v43): probe AT-SPI bus liveness on zbus 5.13'
          git push origin HEAD:wip/v43-l05-zbus-compat-fix

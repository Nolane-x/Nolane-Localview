name: TEMP L05 old transport oracle patch

on:
  push:
    branches:
      - wip/v43-l05-zbus-compat-fix

permissions:
  contents: write

jobs:
  patch-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-l7-linux-l05-bus-reconnect
          fetch-depth: 2
      - name: Require expected PR head
        shell: bash
        run: |
          set -euo pipefail
          expected='17b9c1bf03bad21a4eaece573af80e788bc2da04'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "PR head moved: expected=$expected actual=$actual" >&2
            exit 20
          }
      - name: Patch old-bus liveness oracle to perform a real D-Bus round-trip
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validation-lab/linux-l7-real-provider-harness/tests/v43_real_provider_l05.rs")
          text = path.read_text()
          old = "    async fn wait_until_old_bus_is_dead(connection: &AccessibilityConnection) -> bool {\n        let deadline = Instant::now() + Duration::from_secs(5);\n        loop {\n            if connection.root_accessible_on_registry().await.is_err() {\n                return true;\n            }\n            if Instant::now() >= deadline {\n                return false;\n            }\n            sleep(Duration::from_millis(50)).await;\n        }\n    }\n"
          new = "    async fn wait_until_old_bus_is_dead(connection: &AccessibilityConnection) -> bool {\n        let deadline = Instant::now() + Duration::from_secs(5);\n        loop {\n            let probe = connection\n                .connection()\n                .call_method(\n                    Some(\"org.freedesktop.DBus\"),\n                    \"/org/freedesktop/DBus\",\n                    Some(\"org.freedesktop.DBus\"),\n                    \"GetId\",\n                    &(),\n                )\n                .await;\n            if probe.is_err() {\n                return true;\n            }\n            if Instant::now() >= deadline {\n                return false;\n            }\n            sleep(Duration::from_millis(50)).await;\n        }\n    }\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one old-bus liveness helper, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Format harness
        run: cargo +1.85.0 fmt --manifest-path tools/validation-lab/linux-l7-real-provider-harness/Cargo.toml -- --check
      - name: Compile exact L05 real-provider registration
        shell: bash
        run: |
          set -euo pipefail
          listed="$(cargo +1.85.0 test --manifest-path tools/validation-lab/linux-l7-real-provider-harness/Cargo.toml --test v43_real_provider_l05 -- --list)"
          grep -F 'linux_real_provider_l05::l05_real_accessibility_bus_reconnect_invalidates_old_binding: test' <<<"$listed"
      - name: Commit oracle correction to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validation-lab/linux-l7-real-provider-harness/tests/v43_real_provider_l05.rs
          git diff --cached --check
          git commit -m 'test(v43): probe L05 old transport with real D-Bus call'
          git push origin HEAD:feat/v43-l7-linux-l05-bus-reconnect

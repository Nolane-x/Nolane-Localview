name: Human-first chrome position closure

on:
  push:
    branches:
      - feat/human-first-chrome-position-closure
    paths:
      - .github/workflows/human-first-chrome-position.yml
      - docs/superpowers/specs/2026-09-18-human-first-localview-ui-ux-v2.md
      - apps/desktop/src/**
      - apps/desktop/src-tauri/tests/human_first_chrome_position_contract.rs
      - tools/human-first-ui-v2/**
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

concurrency:
  group: human-first-chrome-position-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify Human-First chrome position contract
        run: cargo test -p localview-desktop --test human_first_chrome_position_contract -- --nocapture
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

  runtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Install Playwright Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Start neutral localhost target
        run: |
          python3 -m http.server 5173 --directory ../../tools/human-first-ui-v2/demo > /tmp/localview-chrome-demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/localview-chrome-demo.log
          exit 1
      - name: Start LocalView frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/localview-chrome-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:1420/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/localview-chrome-vite.log
          exit 1
      - name: Run complete Human-First browser audit
        run: |
          cp ../../tools/human-first-ui-v2/capture.mjs ./capture-human-first-chrome.mjs
          node ./capture-human-first-chrome.mjs
          rm ./capture-human-first-chrome.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localview-human-first-chrome-position
          path: apps/desktop/human-first-ui-v2-render/
          if-no-files-found: error
          retention-days: 7

name: V4.3 Runtime Dispatch Adapter Builder

on:
  push:
    branches:
      - feat/v43-windows-uia-runtime-dispatch-adapter-clean

permissions:
  contents: write

jobs:
  build-runtime-dispatch-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply production runtime adapter patch
        run: python .github/scripts/v43_runtime_dispatch_adapter_builder.py
      - name: Format runtime crate
        run: cargo fmt --all
      - name: Compile runtime adapter contract
        run: cargo check -p localview-windows-observe-runtime --all-targets
      - name: Run runtime adapter contract
        run: cargo test -p localview-windows-observe-runtime --test real_provider_dispatch_executor_contract
      - name: Commit verified production patch and remove builder scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v43-runtime-dispatch-adapter-builder.yml
          git rm .github/scripts/v43_runtime_dispatch_adapter_builder.py
          git add crates/windows-observe-runtime/src/runtime_manager.rs crates/windows-observe-runtime/tests/real_provider_dispatch_executor_contract.rs
          git commit -m "feat(windows-actions): bind runtime one-shot authority to real UIA dispatch"
          git push origin HEAD:feat/v43-windows-uia-runtime-dispatch-adapter-clean

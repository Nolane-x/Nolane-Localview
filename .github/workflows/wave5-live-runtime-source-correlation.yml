name: Wave 5 live runtime source correlation

on:
  push:
    branches:
      - "feat/wave5-live-runtime-source-correlation"
    paths:
      - "crates/source-map/**"
      - "crates/control/**"
      - ".github/workflows/wave5-live-runtime-source-correlation.yml"
      - "docs/superpowers/specs/2026-09-20-wave5-live-runtime-source-correlation-design.md"
  pull_request:
    paths:
      - "crates/source-map/**"
      - "crates/control/**"
      - ".github/workflows/wave5-live-runtime-source-correlation.yml"
      - "docs/superpowers/specs/2026-09-20-wave5-live-runtime-source-correlation-design.md"

concurrency:
  group: wave5-runtime-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify slice formatting
        run: |
          cargo fmt --all
          git diff --exit-code -- \
            crates/control/src/lib.rs \
            crates/control/src/source_map_runtime.rs \
            crates/control/src/runtime_source_map.rs \
            crates/control/tests/runtime_source_correlation.rs

      - name: Preserve bounded Source Map consumer
        run: cargo test -p localview-source-map -- --nocapture

      - name: Preserve project-owned Source Map runtime
        run: cargo test -p localview-control --test project_source_map_runtime -- --nocapture

      - name: Prove live runtime source correlation
        run: cargo test -p localview-control --test runtime_source_correlation -- --nocapture

      - name: Clippy runtime source control
        run: cargo clippy -p localview-control --all-targets --no-deps -- -D warnings

      - name: Check runtime source control
        run: cargo check -p localview-control --all-targets

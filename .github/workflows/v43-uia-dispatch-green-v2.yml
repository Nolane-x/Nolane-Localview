name: V4.3 UIA Dispatch Green Builder v2

on:
  push:
    branches: [feat/v43-windows-uia-real-pattern-dispatch]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-uia-real-pattern-dispatch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact worker patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/windows-uia-provider/src/lib.rs')
          s = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '    InvalidDispatchContextRequest,\n',
              '    InvalidDispatchContextRequest,\n'
              '    #[error("Windows UI Automation pattern dispatch request is invalid")]\n'
              '    InvalidPatternDispatchRequest,\n'
              '    #[error("Windows UI Automation pattern is not enabled for real dispatch: {pattern:?}")]\n'
              '    PatternDispatchUnsupported { pattern: crate::WindowsUiaPattern },\n'
              '    #[error("Windows UI Automation pattern is unavailable at the final dispatch boundary: {pattern:?}")]\n'
              '    PatternUnavailable { pattern: crate::WindowsUiaPattern },\n',
              'worker errors',
          )

          replace_once(
              'CUIAutomation, IUIAutomation, IUIAutomationElement, IUIAutomationTreeWalker,',
              'CUIAutomation, IUIAutomation, IUIAutomationElement, IUIAutomationInvokePattern, IUIAutomationTreeWalker,',
              'UIA invoke interface import',
          )
          replace_once(
              'UIA_IsInvokePatternAvailablePropertyId,',
              'UIA_InvokePatternId, UIA_IsInvokePatternAvailablePropertyId,',
              'UIA invoke pattern id import',
          )
          replace_once(
              'WindowsUiaDispatchContextRequest, WindowsUiaPattern, WindowsUiaPatternSupport,',
              'WindowsUiaDispatchContextRequest, WindowsUiaPattern, WindowsUiaPatternDispatchReceipt,\n        WindowsUiaPatternDispatchRequest, WindowsUiaPatternSupport,',
              'crate imports',
          )

          replace_once(
          '''        RevalidateDispatchContext {
              attachment: WindowsUiaAttachment,
              request: WindowsUiaDispatchContextRequest,
              reply: Sender<Result<WindowsUiaDispatchContextReceipt, WindowsUiaWorkerError>>,
          },
          Shutdown,
          ''',
          '''        RevalidateDispatchContext {
              attachment: WindowsUiaAttachment,
              request: WindowsUiaDispatchContextRequest,
              reply: Sender<Result<WindowsUiaDispatchContextReceipt, WindowsUiaWorkerError>>,
          },
          DispatchPattern {
              attachment: WindowsUiaAttachment,
              request: WindowsUiaPatternDispatchRequest,
              reply: Sender<Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError>>,
          },
          Shutdown,
          ''', 'worker command')

          public_marker = '''        pub fn revalidate_dispatch_context(
              &self,
              attachment: &WindowsUiaAttachment,
              request: WindowsUiaDispatchContextRequest,
          ) -> Result<WindowsUiaDispatchContextReceipt, WindowsUiaWorkerError> {
              if request.snapshot_cut_ref.trim().is_empty() {
                  return Err(WindowsUiaWorkerError::InvalidDispatchContextRequest);
              }
              if attachment.provider_incarnation_ref != self.provider_incarnation_ref {
                  return Err(WindowsUiaWorkerError::TargetReincarnated);
              }

              let (reply_tx, reply_rx) = mpsc::channel();
              self.sender
                  .send(WorkerCommand::RevalidateDispatchContext {
                      attachment: attachment.clone(),
                      request,
                      reply: reply_tx,
                  })
                  .map_err(|_| WindowsUiaWorkerError::WorkerUnavailable)?;
              recv_command(reply_rx, self.command_timeout)
          }
          '''
          public_replacement = public_marker + '''
              pub fn dispatch_pattern(
                  &self,
                  attachment: &WindowsUiaAttachment,
                  request: WindowsUiaPatternDispatchRequest,
              ) -> Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
                  if request.dispatch_attempt_ref.is_nil()
                      || request.action_id.is_nil()
                      || request.preparation_journal_sequence == 0
                      || request.preparation_receipt_ref.trim().is_empty()
                      || request.snapshot_cut_ref.trim().is_empty()
                      || request.provider_incarnation_ref != self.provider_incarnation_ref
                      || request.provider_incarnation_ref != attachment.provider_incarnation_ref
                      || request.target_incarnation_ref != attachment.target_incarnation_ref
                  {
                      return Err(WindowsUiaWorkerError::InvalidPatternDispatchRequest);
                  }

                  let (reply_tx, reply_rx) = mpsc::channel();
                  self.sender
                      .send(WorkerCommand::DispatchPattern {
                          attachment: attachment.clone(),
                          request,
                          reply: reply_tx,
                      })
                      .map_err(|_| WindowsUiaWorkerError::WorkerUnavailable)?;
                  recv_command(reply_rx, self.command_timeout)
              }
          '''
          replace_once(public_marker, public_replacement, 'public dispatch method')

          replace_once(
          '''            WorkerCommand::RevalidateDispatchContext {
                  attachment,
                  request,
                  reply,
              } => {
                  let _ = reply.send(state.revalidate_dispatch_context(&attachment, request));
              }
              WorkerCommand::Shutdown => break,
          ''',
          '''            WorkerCommand::RevalidateDispatchContext {
                  attachment,
                  request,
                  reply,
              } => {
                  let _ = reply.send(state.revalidate_dispatch_context(&attachment, request));
              }
              WorkerCommand::DispatchPattern {
                  attachment,
                  request,
                  reply,
              } => {
                  let _ = reply.send(state.dispatch_pattern(&attachment, request));
              }
              WorkerCommand::Shutdown => break,
          ''', 'worker dispatch match')

          marker = "        fn exact_retained_element<'a>(\n"
          dispatch_impl = '''        fn dispatch_pattern(
              &self,
              attachment: &WindowsUiaAttachment,
              request: WindowsUiaPatternDispatchRequest,
          ) -> Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
              if request.provider_incarnation_ref != self.provider_incarnation_ref
                  || request.provider_incarnation_ref != attachment.provider_incarnation_ref
                  || request.target_incarnation_ref != attachment.target_incarnation_ref
              {
                  return Err(WindowsUiaWorkerError::TargetReincarnated);
              }

              let context = self.revalidate_dispatch_context(
                  attachment,
                  WindowsUiaDispatchContextRequest {
                      snapshot_cut_ref: request.snapshot_cut_ref.clone(),
                      element_ref: request.element_ref.clone(),
                      requirements: request.context_requirements,
                  },
              )?;

              // Re-bind the exact retained COM element after volatile context
              // observation. The second target/cut/element check, live pattern
              // lookup, and Invoke all remain inside this single MTA command.
              let retained = self.exact_retained_element(
                  attachment,
                  &request.snapshot_cut_ref,
                  &request.element_ref,
              )?;

              match request.required_pattern {
                  WindowsUiaPattern::Invoke => {
                      if read_pattern_support(
                          &retained.element,
                          UIA_IsInvokePatternAvailablePropertyId,
                      ) != WindowsUiaPatternSupport::Supported
                      {
                          return Err(WindowsUiaWorkerError::PatternUnavailable {
                              pattern: WindowsUiaPattern::Invoke,
                          });
                      }

                      let invoke = unsafe {
                          // SAFETY: exact retained element and pattern stay on this
                          // worker's owning MTA and availability was re-read above.
                          retained
                              .element
                              .GetCurrentPatternAs::<IUIAutomationInvokePattern>(UIA_InvokePatternId)
                      }
                      .map_err(|_| WindowsUiaWorkerError::PatternUnavailable {
                          pattern: WindowsUiaPattern::Invoke,
                      })?;

                      unsafe {
                          // SAFETY: pattern was acquired from the exact retained
                          // element in this MTA command and never crosses threads.
                          invoke.Invoke()
                      }
                      .map_err(|error| WindowsUiaWorkerError::ProviderFailure(error.to_string()))?;
                  }
                  pattern => {
                      return Err(WindowsUiaWorkerError::PatternDispatchUnsupported { pattern });
                  }
              }

              Ok(WindowsUiaPatternDispatchReceipt {
                  dispatch_attempt_ref: request.dispatch_attempt_ref,
                  action_id: request.action_id,
                  preparation_journal_sequence: request.preparation_journal_sequence,
                  preparation_receipt_ref: request.preparation_receipt_ref,
                  snapshot_cut_ref: request.snapshot_cut_ref,
                  provider_incarnation_ref: request.provider_incarnation_ref,
                  target_incarnation_ref: request.target_incarnation_ref,
                  element_ref: request.element_ref,
                  required_pattern: request.required_pattern,
                  context_requirements: request.context_requirements,
                  final_context: context.observation,
                  transport_result: localview_protocol::TransportResult::DeliveredToExecutor,
                  dispatch_result: localview_protocol::DispatchResult::DispatchedFull,
              })
          }

          '''
          if s.count(marker) != 1:
              raise SystemExit(f'dispatch implementation marker: expected 1, got {s.count(marker)}')
          s = s.replace(marker, dispatch_impl + marker, 1)

          nonwindows_marker = '''        pub fn revalidate_dispatch_context(
              &self,
              _attachment: &WindowsUiaAttachment,
              _request: crate::WindowsUiaDispatchContextRequest,
          ) -> Result<crate::WindowsUiaDispatchContextReceipt, WindowsUiaWorkerError> {
              Err(WindowsUiaWorkerError::UnsupportedPlatform)
          }
          '''
          nonwindows_replacement = nonwindows_marker + '''
              pub fn dispatch_pattern(
                  &self,
                  _attachment: &WindowsUiaAttachment,
                  _request: crate::WindowsUiaPatternDispatchRequest,
              ) -> Result<crate::WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
                  Err(WindowsUiaWorkerError::UnsupportedPlatform)
              }
          '''
          replace_once(nonwindows_marker, nonwindows_replacement, 'non-windows stub')

          path.write_text(s, encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compile Windows UIA provider and contract
        run: cargo check -p localview-windows-uia-provider --all-targets
      - name: Test provider contracts
        run: cargo test -p localview-windows-uia-provider
      - name: Commit validated patch and remove builders
        shell: bash
        run: |
          rm .github/workflows/v43-uia-dispatch-green.yml
          rm .github/workflows/v43-uia-dispatch-green-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-uia-provider .github/workflows/v43-uia-dispatch-green.yml .github/workflows/v43-uia-dispatch-green-v2.yml
          git commit -m "feat(windows-uia): dispatch retained Invoke pattern atomically"
          git push origin HEAD:feat/v43-windows-uia-real-pattern-dispatch

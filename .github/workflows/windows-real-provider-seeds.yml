name: Windows Real Provider Seeds

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: localview-real-provider-seeds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-real-provider-seeds:
    name: V4.3 L7 Windows real-provider seeds W01/W02/W06
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile and test isolated Windows seed package
        run: cargo test --manifest-path tools/provider-seeds/windows-uia-seed/Cargo.toml --all-targets -- --nocapture --test-threads=1

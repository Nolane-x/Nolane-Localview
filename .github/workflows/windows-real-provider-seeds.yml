name: Windows Real Provider Seeds

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: localview-real-provider-seeds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-real-provider-seeds:
    name: V4.3 L7 Windows real-provider seeds W01/W02/W03/W04/W05/W06/W07/W08/W09/W11/W12
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LOCALVIEW_UIA_SMOKE: "1"
      LOCALVIEW_UIA_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-seed\target\debug\localview-windows-uia-seed.exe
      LOCALVIEW_UIA_EDGE_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-edge-seed\bin\Release\net8.0-windows\LocalView.WindowsUiaEdgeSeed.exe
      LOCALVIEW_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and test isolated Windows seed package
        run: cargo test --manifest-path tools/provider-seeds/windows-uia-seed/Cargo.toml --all-targets -- --nocapture --test-threads=1
      - name: Build WPF edge seed for W03/W05/W07/W08/W09/W11/W12
        run: dotnet build tools/provider-seeds/windows-uia-edge-seed/LocalView.WindowsUiaEdgeSeed.csproj -c Release --nologo
      - name: Bind hosted Windows environment authority
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "localview-l7-real-provider"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          "LOCALVIEW_L7_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALVIEW_WINDOWS_BUILD=$([System.Environment]::OSVersion.VersionString)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $culture = (Get-Culture).Name
          $uiCulture = (Get-UICulture).Name
          "LOCALVIEW_LOCALE_INPUT_METHOD=culture=$culture;ui-culture=$uiCulture;input-method=unknown:hosted-runner-not-exposed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALVIEW_DISPLAY_TOPOLOGY=unknown:hosted-runner-not-exposed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALVIEW_DPI_SCALE=unknown:hosted-runner-not-exposed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALVIEW_PERMISSION_STATE=unknown:hosted-runner-not-exposed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: W02 same-provider element ABA authority contract
        run: cargo test -p localview-validation-lab --test w02_same_provider_incarnation -- --nocapture --test-threads=1
      - name: Opaque callback reconciliation authority contract
        run: cargo test -p localview-windows-observe-runtime --test opaque_callback_reconciliation_contract -- --nocapture --test-threads=1
      - name: W06 provider worker reacquire rejects stale authority and cleans up
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w06::w06_provider_reacquire_rebinds_incarnation_and_cleans_up"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w06 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W06 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w06 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W01 missing/coalesced property events require reconciliation
        shell: pwsh
        run: |
          $testName = "windows_real_provider_seeds::w01_missing_or_coalesced_property_events_require_reconciliation"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_seeds -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W01 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_seeds $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W02 recreated element never resurrects stale identity
        shell: pwsh
        run: |
          $testName = "windows_real_provider_seeds::w02_recreated_element_never_resurrects_stale_identity"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_seeds -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W02 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_seeds $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W04 unsupported Invoke stays unsupported through real UIA dispatch boundary
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w04::w04_unsupported_invoke_is_observed_and_rejected_at_dispatch"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w04 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W04 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w04 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W03 virtualized item requires Realize then fresh observation
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w03::w03_virtualized_item_requires_realize_then_fresh_observation"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w03 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W03 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w03 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W05 provider hang quarantines worker then requires fresh reacquire
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w05::w05_provider_hang_poison_requires_fresh_provider_reacquire"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w05 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W05 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w05 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W07 foreground theft is blocked before any real input effect
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w07::w07_foreground_theft_is_blocked_before_any_real_input_effect"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w07 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W07 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w07 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W08 deterministic partial wrapper preserves unknown and denies retry
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w08::w08_deterministic_partial_wrapper_preserves_unknown_without_retry"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w08 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W08 deterministic wrapper test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w08 $testName -- --exact --nocapture --test-threads=1
      - name: W08 production full-dispatch smoke uses journal-minted exact UIA worker authority
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w08_full::w08_production_worker_full_dispatch_uses_authority_path"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w08 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W08 authority-path production smoke is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w08 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W09 held modifier is blocked without normalization or input effect
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w09::w09_user_held_modifier_is_blocked_without_normalization_or_input_effect"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w09 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W09 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w09 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W11 owned modal is blocked before any real input effect
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w11::w11_modal_before_dispatch_is_blocked_before_any_real_input_effect"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w11 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W11 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w11 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: W12 restart rejects stale authority before replacement effect
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w12::w12_restart_rejects_pre_restart_authority_before_any_replacement_effect"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w12 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W12 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w12 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Prospective eleven-seed campaign binds exact W01-W09 plus W11-W12 evidence
        shell: pwsh
        run: |
          $testName = "windows_l7_real_provider_campaign_w11_w12::prospective_l7_campaign_binds_w01_w09_w11_w12_to_exact_candidate"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_campaign_w11_w12 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required bound eleven-seed L7 campaign test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_campaign_w11_w12 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Publish bounded L7 Lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-l7-real-provider-${{ env.LOCALVIEW_CANDIDATE_SHA }}
          path: ${{ env.LOCALVIEW_L7_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

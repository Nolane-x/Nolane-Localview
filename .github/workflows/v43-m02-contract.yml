name: V4.3 M02 Permission Revocation Contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: localview-v43-m02-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m02-permission-revocation-contract:
    name: M02 AX permission revocation contract
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run macOS AX provider authority contracts including M02
        run: cargo test -p localview-macos-ax-provider -- --nocapture

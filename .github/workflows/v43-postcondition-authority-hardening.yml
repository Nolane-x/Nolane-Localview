name: V4.3 Postcondition Authority Hardening

on:
  push:
    branches:
      - feat/v43-consequential-postcondition-reconciliation-clean

permissions:
  contents: write

jobs:
  harden-postcondition-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-consequential-postcondition-reconciliation-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Seal raw journal authority and verify reconciliation gates
        run: python .github/scripts/v43_postcondition_authority_hardening.py

name: Wave 6 scoped rustfmt one-shot

on:
  push:
    branches:
      - "feat/wave6-accessibility-interaction"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/wave6-accessibility-interaction"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Wave 6 owned Rust files only
        run: |
          rustfmt --edition 2024 \
            crates/a11y/src/lib.rs \
            crates/a11y/src/native_ax.rs \
            crates/flow/src/lib.rs \
            crates/instrumentation/src/wave6.rs \
            crates/instrumentation/examples/wave6_bootstrap.rs \
            crates/instrumentation/tests/wave6_accessibility_interaction_contract.rs \
            crates/live-bridge/src/wave6.rs \
            crates/diagnostics/src/lib.rs \
            apps/desktop/src-tauri/src/wave6_accessibility_interaction.rs \
            apps/desktop/src-tauri/tests/wave6_accessibility_interaction_contract.rs
      - name: Commit formatting when required
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/a11y/src/lib.rs \
            crates/a11y/src/native_ax.rs \
            crates/flow/src/lib.rs \
            crates/instrumentation/src/wave6.rs \
            crates/instrumentation/examples/wave6_bootstrap.rs \
            crates/instrumentation/tests/wave6_accessibility_interaction_contract.rs \
            crates/live-bridge/src/wave6.rs \
            crates/diagnostics/src/lib.rs \
            apps/desktop/src-tauri/src/wave6_accessibility_interaction.rs \
            apps/desktop/src-tauri/tests/wave6_accessibility_interaction_contract.rs
          git commit -m "style(wave6): apply scoped rustfmt"
          git push origin HEAD:feat/wave6-accessibility-interaction

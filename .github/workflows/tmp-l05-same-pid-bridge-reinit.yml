name: TEMP L05 same-PID ATK bridge recovery

on:
  push:
    branches:
      - wip/v43-l05-same-pid-bridge-reinit

permissions:
  contents: write

jobs:
  validate-same-pid-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/v43-l05-same-pid-bridge-reinit
          fetch-depth: 2
      - name: Require exact L05 ancestor
        run: git merge-base --is-ancestor fe8d0a890d6d99030d895449805e058c530592b6 HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Install real GTK AT-SPI dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 xvfb at-spi2-core libatk-adaptor procps build-essential pkg-config libgtk-3-dev
      - name: Apply and format same-PID recovery patch
        run: |
          python3 .github/scripts/tmp_l05_same_pid_patch.py
          rm .github/scripts/tmp_l05_same_pid_patch.py
          rm .github/workflows/tmp-l05-same-pid-bridge-reinit.yml
          rustfmt +1.85.0 --edition 2024 tools/validation-lab/linux-l7-real-provider-harness/tests/v43_real_provider_l05.rs
          git diff --check
      - name: Compile patched GTK seed
        run: |
          mkdir -p "$RUNNER_TEMP/localview-v43-l05-staging"
          cc -std=c11 -Wall -Wextra -Werror tools/provider-seeds/linux-atspi-bus-reconnect-seed/seed.c -o "$RUNNER_TEMP/localview-v43-l05-staging/seed" $(pkg-config --cflags --libs gtk+-3.0 atk gmodule-2.0)
      - name: Compile patched L05 registration
        run: cargo +1.85.0 test --manifest-path tools/validation-lab/linux-l7-real-provider-harness/Cargo.toml --test v43_real_provider_l05 -- --list | grep -F 'linux_real_provider_l05::l05_real_accessibility_bus_reconnect_invalidates_old_binding: test'
      - name: Run patched real L05 oracle
        env:
          LOCALVIEW_CANDIDATE_SHA: staging-same-pid-bridge-reinit
          LOCALVIEW_L7_ARTIFACT_DIR: ${{ runner.temp }}/localview-v43-l05-staging
          LOCALVIEW_L05_SEED_BIN: ${{ runner.temp }}/localview-v43-l05-staging/seed
        run: |
          dbus-run-session -- xvfb-run -a env NO_AT_BRIDGE=0 GTK_MODULES=gail:atk-bridge LOCALVIEW_CANDIDATE_SHA="$LOCALVIEW_CANDIDATE_SHA" LOCALVIEW_L7_ARTIFACT_DIR="$LOCALVIEW_L7_ARTIFACT_DIR" LOCALVIEW_L05_SEED_BIN="$LOCALVIEW_L05_SEED_BIN" cargo +1.85.0 test --manifest-path tools/validation-lab/linux-l7-real-provider-harness/Cargo.toml --test v43_real_provider_l05 linux_real_provider_l05::l05_real_accessibility_bus_reconnect_invalidates_old_binding -- --ignored --exact --nocapture --test-threads=1
      - name: Verify patched staging evidence
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/localview-v43-l05-staging/l05-real-provider-evidence.json
        run: python3 -c 'import json,os; e=json.load(open(os.environ["EVIDENCE_PATH"])); assert e["candidate_sha"]=="staging-same-pid-bridge-reinit"; assert e["pre_restart_action_delta"]==1; assert e["post_reconnect_action_delta"]==1; assert e["old_transport_unavailable"] is True; assert e["old_binding_denied_while_disconnected"] is True; assert e["bus_incarnation_changed"] is True; assert e["old_binding_denied_after_reconnect"] is True; assert e["fresh_authorization_succeeded"] is True; assert e["target_process_survived_bus_restart"] is True; assert e["toolkit_bridge_reinitialized_same_pid"] is True; assert e["toolkit_recovery_mode"]=="same_pid_atk_bridge_cleanup_init"; assert e["old_bus_child_pid"] != e["replacement_bus_child_pid"]'
      - name: Commit validated final oracle tree on staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(v43): recover GTK bridge in-place after L05 bus replacement'
          git push origin HEAD:wip/v43-l05-same-pid-bridge-reinit

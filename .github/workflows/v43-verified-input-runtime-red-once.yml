name: V4.3 Verified Input Runtime RED Once

on:
  push:
    branches:
      - feat/v43-l7-windows-w07-w08-w09-input-authority

permissions:
  contents: write

jobs:
  runtime-authority-red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/v43-l7-windows-w07-w08-w09-input-authority
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Task 4 RED tests
        run: python .github/scripts/v43_verified_input_runtime_red.py
      - name: Format RED tests
        run: cargo fmt --all
      - name: Prove missing runtime authority API is RED
        shell: bash
        run: |
          set +e
          cargo test -p localview-windows-observe-runtime --test verified_input_execution_contract --no-run > task4-red.log 2>&1
          status=$?
          set -e
          cat task4-red.log
          if [ "$status" -eq 0 ]; then
            echo "Task 4 contract unexpectedly compiled before implementation" >&2
            exit 1
          fi
          grep -Eq 'WindowsUiaVerifiedInputExecutionCoordinatorError|WindowsUiaVerifiedInputExecutor|WindowsUiaVerifiedInputProviderReceipt' task4-red.log
      - name: Remove RED staging machinery and commit tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v43-verified-input-runtime-red-once.yml .github/scripts/v43_verified_input_runtime_red.py
          git add -A
          git diff --cached --check
          git commit -m "test(v43): require verified-input journal authority"
          git push origin HEAD:feat/v43-l7-windows-w07-w08-w09-input-authority

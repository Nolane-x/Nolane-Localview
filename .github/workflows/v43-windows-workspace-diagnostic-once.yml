name: V4.3 Windows Provider Diagnostic Once

on:
  push:
    branches:
      - feat/v43-l7-windows-w07-w08-w09-input-authority
    paths:
      - .github/workflows/v43-windows-workspace-diagnostic-once.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: localview-windows-uia-provider

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          targets=$(cargo metadata --no-deps --format-version 1 | jq -c '[.packages[] | select(.name == "localview-windows-uia-provider") | .targets[] | select(.kind | index("test")) | .name]')
          test "$(echo "$targets" | jq 'length')" -gt 0
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets" | jq .

  integration-targets:
    needs: targets
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    name: Provider test / ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: v43-windows-provider-diagnostic
      - name: Test target ${{ matrix.target }}
        shell: pwsh
        run: cargo test -p "$env:PACKAGE" --test "${{ matrix.target }}" -- --nocapture

  library:
    runs-on: windows-latest
    timeout-minutes: 15
    name: Provider test / lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: v43-windows-provider-diagnostic
      - name: Test provider library
        shell: pwsh
        run: cargo test -p "$env:PACKAGE" --lib -- --nocapture

  doctests:
    runs-on: windows-latest
    timeout-minutes: 15
    name: Provider test / doc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: v43-windows-provider-diagnostic
      - name: Test provider doctests
        shell: pwsh
        run: cargo test -p "$env:PACKAGE" --doc -- --nocapture

name: V4.3 Format Missing Operation Cleanup V2

on:
  push:
    branches:
      - feat/v43-windows-set-value-payload-authority

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-set-value-payload-authority
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Normalize only the affected Rust module
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/control/src/windows_consequential.rs
          git diff --check
          changed="$(git diff --name-only)"
          printf 'changed files after scoped rustfmt:\n%s\n' "$changed"
          test "$changed" = "crates/control/src/windows_consequential.rs"
      - name: Verify missing-operation cleanup GREEN
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p localview-control --test windows_consequential_set_value_missing_operation_cleanup -- --nocapture
          cargo check -p localview-control
          cargo clippy -p localview-control --all-targets --no-deps -- -D warnings
      - name: Commit normalized production source and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/control/src/windows_consequential.rs
          git rm .github/workflows/v43-format-missing-operation-cleanup.yml
          git rm .github/workflows/v43-format-missing-operation-cleanup-v2.yml
          git commit -m "fix(v43): consume SetValue payload when operation binding is missing"
          git push origin HEAD:feat/v43-windows-set-value-payload-authority
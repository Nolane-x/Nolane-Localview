name: Wave 5 bounded source-map consumer

on:
  push:
    branches:
      - "feat/wave5-source-map-consumer"
    paths:
      - "crates/source-map/**"
      - ".github/workflows/wave5-source-map-consumer.yml"
      - "docs/superpowers/specs/2026-09-19-wave5-bounded-source-map-v3-consumer-design.md"
  pull_request:
    paths:
      - "crates/source-map/**"
      - ".github/workflows/wave5-source-map-consumer.yml"
      - "docs/superpowers/specs/2026-09-19-wave5-bounded-source-map-v3-consumer-design.md"

concurrency:
  group: wave5-source-map-consumer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Normalize source-map formatting
        run: cargo fmt -p localview-source-map

      - name: Source-map unit tests
        run: cargo test -p localview-source-map -- --nocapture

      - name: Source-map clippy
        run: cargo clippy -p localview-source-map --all-targets -- -D warnings

      - name: Source-map compile
        run: cargo check -p localview-source-map --all-targets

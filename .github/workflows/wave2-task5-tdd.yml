name: Wave 2 Task 5 red-green gate

on:
  push:
    branches:
      - feat/guarded-full-page-stitching-impl
    paths:
      - .github/workflows/wave2-task5-tdd.yml

permissions:
  contents: write

jobs:
  task5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guarded-full-page-stitching-impl
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify RED
        shell: bash
        run: |
          set +e
          cargo test -p localview-control --test full_page_capture_control full_page_visual_evidence_ -- --nocapture 2>&1 | tee /tmp/task5-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "full_page_visual_evidence" /tmp/task5-red.log
          grep -q "FAILED\|failed" /tmp/task5-red.log
      - name: Apply Task 5 implementation
        run: python scripts/wave2_task5_patch.py
      - name: Verify GREEN
        run: |
          git diff --check
          cargo test -p localview-control --test full_page_capture_control -- --nocapture
          cargo test -p localview-control --test visual_evidence
          cargo check -p localview-control --all-targets
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/control/src/visual_full_page.rs crates/control/src/lib.rs
          git diff --cached --check
          git commit -m "feat(evidence): add full-page visual provenance"
          git push origin HEAD:feat/guarded-full-page-stitching-impl

name: M07 Clippy Fix Once

on:
  push:
    branches:
      - feat/v43-l7-macos-m07-observer-continuity

permissions:
  contents: write

concurrency:
  group: localview-v43-m07-clippy-fix-once
  cancel-in-progress: false

jobs:
  patch-once:
    if: ${{ !contains(github.event.head_commit.message, 'gate native M07 callback plumbing by platform') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact M07 platform gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/macos-ax-provider/src/observer_continuity.rs')
          text = path.read_text()

          replacements = [
              (
                  '''use std::{\n    collections::HashMap,\n    ffi::c_void,\n    sync::{\n        atomic::{AtomicU64, AtomicUsize, Ordering},\n        Arc, Mutex, OnceLock, Weak,\n    },\n};\n''',
                  '''use std::{\n    collections::HashMap,\n    sync::{\n        atomic::{AtomicU64, AtomicUsize, Ordering},\n        Arc, Mutex, OnceLock, Weak,\n    },\n};\n\n#[cfg(any(target_os = "macos", test))]\nuse std::ffi::c_void;\n''',
              ),
              (
                  '''type AxObserverCallbackFn = unsafe extern "C" fn(\n''',
                  '''#[cfg(target_os = "macos")]\ntype AxObserverCallbackFn = unsafe extern "C" fn(\n''',
              ),
              (
                  '''    fn callback_refcon(&self) -> *mut c_void {\n''',
                  '''    #[cfg(any(target_os = "macos", test))]\n    fn callback_refcon(&self) -> *mut c_void {\n''',
              ),
              (
                  '''unsafe extern "C" fn tracked_ax_observer_callback(\n''',
                  '''#[cfg(any(target_os = "macos", test))]\nunsafe extern "C" fn tracked_ax_observer_callback(\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement count {count}, expected 1: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify focused cross-platform contract
        run: |
          set -euo pipefail
          cargo check -p localview-macos-ax-provider
          cargo clippy -p localview-macos-ax-provider --all-targets -- -D warnings
          cargo test -p localview-macos-ax-provider --lib --tests -- --nocapture
          cargo test -p localview-macos-ax-provider --doc -- --nocapture
      - name: Commit code only and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m07-clippy-fix-once.yml
          git add crates/macos-ax-provider/src/observer_continuity.rs
          git diff --cached --check
          git commit -m 'fix(v43): gate native M07 callback plumbing by platform'
          git push origin HEAD:feat/v43-l7-macos-m07-observer-continuity

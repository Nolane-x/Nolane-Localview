name: V4.3 W13 Real Provider RED Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  w13-real-provider-registration-red:
    name: W13 real-provider coverage must exist
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Require exact W13 real-provider test registration
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w13::w13_sensitive_password_never_enters_semantic_snapshot_or_artifact"
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w13 -- --list
          if ($LASTEXITCODE -ne 0) {
            throw "W13 RED: required real-provider test target is absent: $testName"
          }
          if (-not ($LASTEXITCODE -eq 0)) { exit $LASTEXITCODE }
          if (-not ((cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w13 -- --list) | Select-String -SimpleMatch "${testName}: test")) {
            throw "W13 RED: required real-provider test is not registered: $testName"
          }
          throw "W13 RED unexpectedly passed; remove this one-shot proof after observing the intended failure"

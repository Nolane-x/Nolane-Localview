name: V4.3 Runtime Dispatch Smoke Validate

on:
  push:
    branches:
      - feat/v43-windows-uia-runtime-dispatch-adapter-clean

permissions:
  contents: read

jobs:
  real-runtime-dispatch-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile runtime with production adapter
        run: cargo check -p localview-windows-observe-runtime --all-targets
      - name: Real coordinator to retained UIA Invoke to durable linearization
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-observe-runtime --test windows_runtime_dispatch_smoke -- --ignored --nocapture --test-threads=1

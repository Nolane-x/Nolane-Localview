name: V4.3 SetValue Missing Operation Cleanup

on:
  push:
    branches:
      - feat/v43-windows-set-value-payload-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-set-value-payload-authority
          fetch-depth: 0
      - name: Apply exact minimal GREEN fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/control/src/windows_consequential.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        Ok(None) => {
              let _ = consume_pending_plan(&control, session_id, action_id, request.confirmation_ref)
                  .await;
              return (
                  StatusCode::CONFLICT,
                  Json(serde_json::json!({
                      "error": "windows_consequential_operation_binding_missing",
                      "action_id": action_id,
                      "confirmation_consumed": true,
                      "retry_allowed": false,
                      "replan_required": true,
                  })),
              )
                  .into_response();
          }
          Err(error) => {'''
          new = '''        Ok(None) => {
              let _ = consume_pending_plan(&control, session_id, action_id, request.confirmation_ref)
                  .await;
              if control
                  .set_value
                  .peek(session_id, action_id, request.confirmation_ref)
                  .await
              {
                  let _ = control
                      .set_value
                      .consume_verified(
                          control.journal.as_ref(),
                          session_id,
                          action_id,
                          request.confirmation_ref,
                      )
                      .await;
              }
              return (
                  StatusCode::CONFLICT,
                  Json(serde_json::json!({
                      "error": "windows_consequential_operation_binding_missing",
                      "action_id": action_id,
                      "confirmation_consumed": true,
                      "retry_allowed": false,
                      "replan_required": true,
                  })),
              )
                  .into_response();
          }
          Err(error) => {'''
          if text.count(old) != 1:
              raise SystemExit(f'exact patch anchor count={text.count(old)}; refusing mutation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/control/src/windows_consequential.rs
          git rm .github/workflows/v43-set-value-missing-operation-cleanup.yml
          git commit -m "fix(v43): consume SetValue authority on missing operation"
          git push origin HEAD:feat/v43-windows-set-value-payload-authority

name: V4.3 SetValue Missing Operation Cleanup

on:
  push:
    branches:
      - feat/v43-windows-set-value-payload-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-set-value-payload-authority
          fetch-depth: 0
      - name: Apply exact minimal GREEN fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/control/src/windows_consequential.rs')
          text = path.read_text(encoding='utf-8')
          match_marker = 'let admitted_operation = match control.journal.admitted_operation(action_id).await'
          match_start = text.index(match_marker)
          ok_start = text.index('        Ok(None) => {', match_start)
          err_start = text.index('        Err(error) => {', ok_start)
          branch = text[ok_start:err_start]
          if 'control.set_value' in branch:
              raise SystemExit('missing-operation branch already has SetValue cleanup; refusing duplicate mutation')
          needle = '                .await;\n            return ('
          if branch.count(needle) != 1:
              raise SystemExit(f'branch cleanup insertion anchor count={branch.count(needle)}; refusing mutation')
          cleanup = '''                .await;
            if control
                .set_value
                .peek(session_id, action_id, request.confirmation_ref)
                .await
            {
                let _ = control
                    .set_value
                    .consume_verified(
                        control.journal.as_ref(),
                        session_id,
                        action_id,
                        request.confirmation_ref,
                    )
                    .await;
            }
            return ('''
          updated_branch = branch.replace(needle, cleanup, 1)
          updated = text[:ok_start] + updated_branch + text[err_start:]
          path.write_text(updated, encoding='utf-8')
      - name: Commit fix and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/control/src/windows_consequential.rs
          git rm .github/workflows/v43-set-value-missing-operation-cleanup.yml
          git commit -m "fix(v43): consume SetValue authority on missing operation"
          git push origin HEAD:feat/v43-windows-set-value-payload-authority

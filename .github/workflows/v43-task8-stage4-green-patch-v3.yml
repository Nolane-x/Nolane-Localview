name: V4.3 Task 8 Stage 4 GREEN Patch v3

on:
  pull_request:
    paths:
      - '.github/workflows/v43-task8-stage4-green-patch-v3.yml'

permissions:
  contents: write

jobs:
  patch-stage4:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reuse exact reviewed Stage 4 patch program
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/v43-task8-stage4-green-patch.yml').read_text(encoding='utf-8')
          step = '      - name: Wire exact SetValue confirmation to dedicated verified execution\n'
          next_step = '      - name: Format and verify exact production scope\n'
          start = source.index(step)
          marker = '        run: |\n'
          body_start = source.index(marker, start) + len(marker)
          body_end = source.index(next_step, body_start)
          lines = source[body_start:body_end].splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('reviewed Stage 4 patch body indentation changed')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          exec(compile(script, '<stage4-reviewed-patch>', 'exec'), {'__name__': '__main__'})
      - name: Format and scope only the two production files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true \
            crates/control/src/windows_consequential.rs \
            crates/control/src/windows_consequential/set_value_http.rs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/control/src/windows_consequential.rs\ncrates/control/src/windows_consequential/set_value_http.rs'
          test "$changed" = "$expected"
      - name: Compile and lint localview-control only
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p localview-control
          cargo clippy -p localview-control --all-targets --no-deps -- -D warnings
      - name: Commit Stage 4 production GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'localview-ci'
          git config user.email 'localview-ci@users.noreply.github.com'
          git add crates/control/src/windows_consequential.rs crates/control/src/windows_consequential/set_value_http.rs
          git commit -m 'feat(v43): execute confirmed SetValue through verified path'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

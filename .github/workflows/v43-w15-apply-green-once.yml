name: V4.3 W15 Apply GREEN Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v43-w15-apply-green-once.yml'

permissions:
  contents: write

jobs:
  apply-green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact W15 typed resource-bounded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def unique_index(lines, predicate, label):
              matches = [i for i, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one {label}, found {len(matches)}')
              return matches[0]

          runtime = Path('crates/windows-observe-runtime/src/runtime_manager.rs')
          lines = runtime.read_text().splitlines()
          if not any('ResourceBounded {' in line for line in lines):
              insert_at = unique_index(
                  lines,
                  lambda line: 'Windows observe subscription provider lineage does not match the worker' in line,
                  'runtime subscription-provider error anchor',
              )
              block = [
                  '    #[error("Windows observe reconciliation is resource-bounded during {operation}: exhausted={exhausted:?}")]',
                  '    ResourceBounded {',
                  "        operation: &'static str,",
                  '        exhausted: Vec<localview_native_provider::SnapshotBudgetLimit>,',
                  '        incompleteness_debt: Vec<String>,',
                  '    },',
              ]
              lines[insert_at:insert_at] = block
              runtime.write_text('\n'.join(lines) + '\n')

          fresh = Path('crates/windows-observe-runtime/src/fresh_action_evidence.rs')
          lines = fresh.read_text().splitlines()
          if not any('WindowsObserveRuntimeError::ResourceBounded' in line for line in lines):
              start = unique_index(
                  lines,
                  lambda line: line.strip() == 'if snapshot.completeness() != ReconciliationCompleteness::Established',
                  'fresh-action incomplete-start anchor',
              )
              end = unique_index(
                  lines,
                  lambda line: line.strip().startswith('let mut matches = snapshot.nodes().iter().filter'),
                  'fresh-action rebind anchor',
              )
              if not start < end:
                  raise SystemExit('fresh-action incomplete block must precede rebind block')
              block = [
                  '        if snapshot.resource_usage().incomplete',
                  '            && !snapshot.resource_usage().exhausted.is_empty()',
                  '        {',
                  '            return Err(WindowsObserveRuntimeError::ResourceBounded {',
                  '                operation: "fresh_action_evidence_snapshot",',
                  '                exhausted: snapshot.resource_usage().exhausted.clone(),',
                  '                incompleteness_debt: snapshot.incompleteness_debt().to_vec(),',
                  '            });',
                  '        }',
                  '',
                  '        if snapshot.completeness() != ReconciliationCompleteness::Established',
                  '            || !snapshot.incompleteness_debt().is_empty()',
                  '        {',
                  '            return Err(WindowsObserveRuntimeError::Provider {',
                  '                operation: "fresh_action_evidence_snapshot_incomplete",',
                  '                message: format!(',
                  '                    "fresh planning observation {} is incomplete and cannot authorize action binding",',
                  '                    snapshot.snapshot_cut_ref()',
                  '                ),',
                  '            });',
                  '        }',
                  '',
              ]
              lines[start:end] = block
              fresh.write_text('\n'.join(lines) + '\n')

          test = Path('crates/windows-observe-runtime/tests/w15_resource_bounded_contract.rs')
          lines = test.read_text().splitlines()
          if not any('WindowsObserveRuntimeError,' in line for line in lines):
              idx = unique_index(
                  lines,
                  lambda line: 'WindowsObserveProvider, WindowsObserveRuntimeConfig, WindowsObserveRuntimeManager,' in line,
                  'W15 runtime import anchor',
              )
              lines[idx:idx + 1] = [
                  '    WindowsObserveProvider, WindowsObserveRuntimeConfig, WindowsObserveRuntimeError,',
                  '    WindowsObserveRuntimeManager, WindowsObserveSubscriptionLineage,',
              ]

          if not any('WindowsObserveRuntimeError::ResourceBounded {' in line for line in lines):
              marker = unique_index(
                  lines,
                  lambda line: 'error.to_string().contains("resource-bounded")' in line,
                  'W15 RED assertion marker',
              )
              start = marker
              while start >= 0 and lines[start].strip() != 'assert!(':
                  start -= 1
              if start < 0:
                  raise SystemExit('W15 RED assertion start not found')
              end = marker
              while end < len(lines) and lines[end].strip() != ');':
                  end += 1
              if end >= len(lines):
                  raise SystemExit('W15 RED assertion end not found')
              replacement = [
                  '    assert_eq!(',
                  '        error,',
                  '        WindowsObserveRuntimeError::ResourceBounded {',
                  '            operation: "fresh_action_evidence_snapshot",',
                  '            exhausted: vec![SnapshotBudgetLimit::Nodes],',
                  '            incompleteness_debt: vec!["snapshot_budget_exhausted:Nodes".into()],',
                  '        }',
                  '    );',
              ]
              lines[start:end + 1] = replacement
          test.write_text('\n'.join(lines) + '\n')
          PY
      - name: Format and verify focused W15 GREEN
        run: |
          cargo fmt --all
          cargo check -p localview-windows-observe-runtime --all-targets
          cargo test -p localview-windows-observe-runtime --test w15_resource_bounded_contract -- --nocapture
          cargo test -p localview-windows-observe-runtime --test fresh_action_evidence_contract -- --nocapture
      - name: Commit verified W15 GREEN patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'W15 GREEN patch already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/windows-observe-runtime/src/runtime_manager.rs \
                  crates/windows-observe-runtime/src/fresh_action_evidence.rs \
                  crates/windows-observe-runtime/tests/w15_resource_bounded_contract.rs
          git commit -m 'feat(v43): type resource-bounded reconciliation outcome'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: V4.3 W15 Apply Traversal Fix Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v43-w15-apply-traversal-fix-once.yml'

permissions:
  contents: write

jobs:
  prove-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LOCALVIEW_UIA_SMOKE: "1"
      LOCALVIEW_UIA_EDGE_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-edge-seed\bin\Release\net8.0-windows\LocalView.WindowsUiaEdgeSeed.exe
      LOCALVIEW_CANDIDATE_SHA: local-prove-before-commit
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply exact one-overflow traversal probe patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('crates/windows-uia-provider/src/lib.rs')
          lines = path.read_text().splitlines()

          starts = [
              i for i, line in enumerate(lines)
              if line.strip() == 'if depth >= budget.max_depth || nodes.len() >= budget.max_nodes {'
          ]
          if len(starts) != 1:
              raise SystemExit(f'expected exactly one old traversal boundary start, found {len(starts)}')
          start = starts[0]

          ends = [
              i for i, line in enumerate(lines[start + 1:], start + 1)
              if line.strip() == 'let usage = guard.finish();'
          ]
          if len(ends) != 1:
              raise SystemExit(f'expected exactly one traversal usage boundary after start, found {len(ends)}')
          end = ends[0]

          old_region = '\n'.join(lines[start:end])
          required = [
              'walker.GetFirstChildElement(&element)',
              'walker.GetNextSiblingElement(&current_child)',
              'nodes.len().saturating_add(queue.len()) >= budget.max_nodes',
              'queue.push_back((current_child, Some(index), depth.saturating_add(1)))',
          ]
          for needle in required:
              if old_region.count(needle) != 1:
                  raise SystemExit(f'old traversal region does not contain exact unique anchor: {needle}')

          indent = '            '
          replacement = [
              indent + '// Traverse normally within the budget, but retain exactly one child',
              indent + '// beyond a node/depth boundary as a bounded probe. The next guard',
              indent + '// admission rejects that probe and records the exhausted dimension;',
              indent + '// without it, pruning at the boundary could silently report a',
              indent + '// truncated enumeration as complete.',
              indent + 'let child_depth = depth.saturating_add(1);',
              indent + 'let mut child = unsafe {',
              indent + '    // SAFETY: walker and element are apartment-owned COM interfaces.',
              indent + '    walker.GetFirstChildElement(&element)',
              indent + '}',
              indent + '.ok();',
              indent + 'while let Some(current_child) = child {',
              indent + '    let observed_or_queued = nodes.len().saturating_add(queue.len());',
              indent + '    if observed_or_queued > budget.max_nodes {',
              indent + '        break;',
              indent + '    }',
              '',
              indent + '    let boundary_probe = child_depth > budget.max_depth',
              indent + '        || observed_or_queued >= budget.max_nodes;',
              indent + '    queue.push_back((current_child.clone(), Some(index), child_depth));',
              indent + '    if boundary_probe {',
              indent + '        break;',
              indent + '    }',
              '',
              indent + '    child = unsafe {',
              indent + '        // SAFETY: current_child remains live in this MTA while asking',
              indent + '        // the same walker for its next sibling.',
              indent + '        walker.GetNextSiblingElement(&current_child)',
              indent + '    }',
              indent + '    .ok();',
              indent + '}',
              '',
          ]
          lines[start:end] = replacement
          path.write_text('\n'.join(lines) + '\n')
          '@ | python -
      - name: Format and verify provider contracts
        shell: pwsh
        run: |
          cargo fmt --all
          cargo check -p localview-windows-uia-provider
          cargo test -p localview-native-provider snapshot_budget -- --nocapture
          cargo test -p localview-windows-uia-provider custom_semantic_coverage_contract -- --nocapture
      - name: Build WPF seed for real W15 proof
        run: dotnet build tools/provider-seeds/windows-uia-edge-seed/LocalView.WindowsUiaEdgeSeed.csproj -c Release --nologo
      - name: Prove real W15 GREEN before commit
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w15::w15_low_resource_reconciliation_stays_incomplete_and_typed"
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w15 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Commit only verified traversal fix
        shell: pwsh
        run: |
          if (git diff --quiet) {
            Write-Host "Traversal fix already present; nothing to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-uia-provider/src/lib.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "expected verified traversal fix to be staged" }
          git commit -m "fix(v43): expose snapshot budget truncation as incomplete"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: V4.3 W11 Modal Null GREEN Once

on:
  push:
    branches: [feat/v43-l7-windows-w11-w12-race-authority]
    paths:
      - .github/workflows/v43-w11-modal-null-green-once.yml

permissions:
  contents: write

jobs:
  prove-modal-null-semantics:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LOCALVIEW_UIA_SMOKE: "1"
      LOCALVIEW_UIA_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-seed\target\debug\localview-windows-uia-seed.exe
      LOCALVIEW_UIA_EDGE_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-edge-seed\bin\Release\net8.0-windows\LocalView.WindowsUiaEdgeSeed.exe
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply minimal no-popup semantic patch in runner only
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("crates/windows-uia-provider/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            let modal_blocker_window_handle = if request.requirements.require_no_modal_blocker {
                          let popup = unsafe {
                              // SAFETY: target HWND was revalidated by exact_retained_element.
                              GetWindow(target_hwnd, GW_ENABLEDPOPUP)
                                  .map_err(|error| WindowsUiaWorkerError::ProviderFailure(error.to_string()))?
                          };
                          let popup_handle = hwnd_to_u64(popup);
                          match popup_handle {
                              Some(handle)
                                  if handle != attachment.selection.native_window_handle
                                      && unsafe { IsWindowVisible(popup) }.as_bool() =>
                              {
                                  Some(handle)
                              }
                              _ => None,
                          }
                      } else {'''
          new = '''            let modal_blocker_window_handle = if request.requirements.require_no_modal_blocker {
                          match unsafe {
                              // SAFETY: target HWND was revalidated by exact_retained_element.
                              GetWindow(target_hwnd, GW_ENABLEDPOPUP)
                          } {
                              Ok(popup) => {
                                  let popup_handle = hwnd_to_u64(popup);
                                  match popup_handle {
                                      Some(handle)
                                          if handle != attachment.selection.native_window_handle
                                              && unsafe { IsWindowVisible(popup) }.as_bool() =>
                                      {
                                          Some(handle)
                                      }
                                      _ => None,
                                  }
                              }
                              Err(error) if error.code().is_ok() => None,
                              Err(error) => {
                                  return Err(WindowsUiaWorkerError::ProviderFailure(error.to_string()));
                              }
                          }
                      } else {'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one modal detector anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | python -
          cargo fmt --all
          git diff --check
          git diff -- crates/windows-uia-provider/src/lib.rs
      - name: Build classic Win32 UIA seed
        run: cargo build --manifest-path tools/provider-seeds/windows-uia-seed/Cargo.toml
      - name: Prove normal no-popup dispatch context remains valid
        run: cargo test -p localview-windows-uia-provider --test dispatch_context_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Build W11 WPF seed
        run: dotnet build tools/provider-seeds/windows-uia-edge-seed/LocalView.WindowsUiaEdgeSeed.csproj -c Release --nologo
      - name: Prove W11 owned modal still blocks
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w11::w11_modal_before_dispatch_is_blocked_before_any_real_input_effect"
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w11 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Create detached commit object from proven source
        shell: pwsh
        run: |
          $sourcePath = "crates/windows-uia-provider/src/lib.rs"
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($sourcePath))
          $blobPayload = @{ content = $content; encoding = "base64" } | ConvertTo-Json -Compress
          $blob = $blobPayload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/blobs" --input - | ConvertFrom-Json
          $base = gh api "repos/$env:GITHUB_REPOSITORY/git/commits/$env:GITHUB_SHA" | ConvertFrom-Json
          $treePayload = @{
            base_tree = $base.tree.sha
            tree = @(@{ path = $sourcePath; mode = "100644"; type = "blob"; sha = $blob.sha })
          } | ConvertTo-Json -Depth 6 -Compress
          $tree = $treePayload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/trees" --input - | ConvertFrom-Json
          $commitPayload = @{
            message = "fix(v43): treat absent enabled popup as no modal blocker"
            tree = $tree.sha
            parents = @($env:GITHUB_SHA)
          } | ConvertTo-Json -Depth 4 -Compress
          $commit = $commitPayload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/commits" --input - | ConvertFrom-Json
          if (-not $commit.sha) { throw "detached proven commit SHA was not returned" }
          $commit.sha | Set-Content -Path "$env:RUNNER_TEMP\proven-commit-sha.txt" -Encoding ascii
          Write-Host "Detached proven commit: $($commit.sha)"
      - name: Upload detached commit proof
        uses: actions/upload-artifact@v4
        with:
          name: v43-w11-modal-null-detached-commit-${{ github.sha }}
          path: ${{ runner.temp }}\proven-commit-sha.txt
          if-no-files-found: error
          retention-days: 1

name: Human-first trusted Open Source V2.3 gate

on:
  push:
    branches:
      - feat/human-first-trusted-open-source-v23
    paths:
      - .github/workflows/human-first-trusted-open-source-v23.yml
      - .github/workflows/human-first-trusted-open-source-v23-render.yml
      - crates/control/src/**
      - crates/control/tests/**
      - crates/protocol/src/**
      - apps/desktop/src/**
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/permissions/**
      - apps/desktop/src-tauri/tests/**
      - tools/human-first-ui-v2/**
      - docs/superpowers/specs/2026-09-18-human-first-trusted-open-source-v23.md
  workflow_dispatch:

concurrency:
  group: human-first-trusted-open-source-v23-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify trusted Open Source V2.3 contract
        run: cargo test -p localview-desktop --test human_first_trusted_open_source_v23_contract -- --nocapture
      - name: Verify trusted source resolver, containment and launcher validators
        run: cargo test -p localview-desktop trusted_source --lib -- --nocapture
      - name: Verify fresh semantic snapshot authority remains green
        run: cargo test -p localview-control fresh_snapshot --lib -- --nocapture
      - name: Verify trusted Measure V2.2 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_measure_v22_contract -- --nocapture
      - name: Verify trusted Capture V2.1 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_capture_v21_contract -- --nocapture
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

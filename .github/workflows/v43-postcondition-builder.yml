name: V4.3 Postcondition Builder

on:
  push:
    branches:
      - feat/v43-consequential-postcondition-reconciliation-clean

permissions:
  contents: write

jobs:
  build-postcondition-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-consequential-postcondition-reconciliation-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build typed reconciliation and verify contracts
        run: python .github/scripts/v43_postcondition_builder.py

name: V4.3 Task 8 Wire Control State

on:
  push:
    branches: [feat/v43-windows-set-value-payload-authority]

permissions:
  contents: write

jobs:
  wire-control-state:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-set-value-payload-authority
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wire process-local SetValue state into control lifetime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/control/src/windows_consequential.rs')
          s = p.read_text()
          replacements = [
              (
                  '''struct WindowsConsequentialControlHandle {\n    journal: Arc<ConsequentialJournal>,\n    pending: Arc<Mutex<HashMap<Uuid, PendingWindowsConsequentialPlan>>>,\n    plan_gate: Arc<Mutex<()>>,\n}''',
                  '''struct WindowsConsequentialControlHandle {\n    journal: Arc<ConsequentialJournal>,\n    pending: Arc<Mutex<HashMap<Uuid, PendingWindowsConsequentialPlan>>>,\n    plan_gate: Arc<Mutex<()>>,\n    set_value: set_value_http::WindowsSetValuePayloadAuthority,\n}'''
              ),
              (
                  '''        Some(journal) => {\n            entries.insert(''',
                  '''        Some(journal) => {\n            let set_value = match set_value_http::WindowsSetValuePayloadAuthority::new() {\n                Ok(authority) => authority,\n                Err(_) => {\n                    entries.remove(&key);\n                    return;\n                }\n            };\n            entries.insert('''
              ),
              (
                  '''                        pending: Arc::new(Mutex::new(HashMap::new())),\n                        plan_gate: Arc::new(Mutex::new(())),\n                    },''',
                  '''                        pending: Arc::new(Mutex::new(HashMap::new())),\n                        plan_gate: Arc::new(Mutex::new(())),\n                        set_value,\n                    },'''
              ),
              (
                  '''        .await\n        .retain(|_, plan| plan.queued.action.session_id != session_id);\n}''',
                  '''        .await\n        .retain(|_, plan| plan.queued.action.session_id != session_id);\n    handle.set_value.release_session(session_id).await;\n}'''
              ),
              (
                  '''                pending: Arc::new(Mutex::new(HashMap::new())),\n                plan_gate: Arc::new(Mutex::new(())),\n            },''',
                  '''                pending: Arc::new(Mutex::new(HashMap::new())),\n                plan_gate: Arc::new(Mutex::new(())),\n                set_value: set_value_http::WindowsSetValuePayloadAuthority::new().unwrap(),\n            },'''
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, found {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Focused control tests
        run: cargo test -p localview-control --lib windows_consequential:: -- --nocapture
      - name: Check control crate
        run: cargo check -p localview-control
      - name: Commit exact wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/control/src/windows_consequential.rs
          git diff --cached --check
          git commit -m "feat(v43): bind SetValue state to control lifetime"
          git push origin HEAD:feat/v43-windows-set-value-payload-authority

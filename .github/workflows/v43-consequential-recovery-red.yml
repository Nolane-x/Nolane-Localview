name: V43 consequential recovery RED evidence

on:
  push:
    branches:
      - feat/v43-consequential-recovery-coordinator

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p localview-windows-observe-runtime --test execution_coordinator_behavior restart_ -- --nocapture

name: Wave 2 branch patch

on:
  push:
    branches:
      - feat/guarded-full-page-stitching-impl
    paths:
      - .github/workflows/wave2-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guarded-full-page-stitching-impl
      - name: Apply bounded validation lint fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/live-bridge/src/lib.rs")
          text = path.read_text()
          replacements = {
              "value.is_finite() && value >= 0.0 && value <= MAX_CSS_VIEWPORT_DIMENSION":
                  "value.is_finite() && (0.0..=MAX_CSS_VIEWPORT_DIMENSION).contains(&value)",
              "value.is_finite() && value >= 0.0 && value <= MAX_FULL_PAGE_DOCUMENT_CSS_HEIGHT":
                  "value.is_finite() && (0.0..=MAX_FULL_PAGE_DOCUMENT_CSS_HEIGHT).contains(&value)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence: {old}")
              text = text.replace(old, new)
          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/live-bridge/src/lib.rs
          git diff --cached --check
          git commit -m "fix(live-bridge): satisfy bounded coordinate lint"
          git push origin HEAD:feat/guarded-full-page-stitching-impl

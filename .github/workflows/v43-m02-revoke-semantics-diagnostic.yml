name: V4.3 M02 Revoke Semantics Diagnostic

on:
  pull_request:

concurrency:
  group: localview-v43-m02-revoke-semantics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: M02 isolated LocalView TCC identity revoke
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      PROBE_BUNDLE_ID: dev.nolane.localview.m02probe
      PROBE_DISPLAY_NAME: LocalView M02 Probe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build isolated signed LocalView M02 probe app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/LocalViewM02Probe.app"
          exe="$app/Contents/MacOS/LocalViewM02Probe"
          mkdir -p "$app/Contents/MacOS"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>LocalViewM02Probe</string>
            <key>CFBundleIdentifier</key><string>${PROBE_BUNDLE_ID}</string>
            <key>CFBundleName</key><string>${PROBE_DISPLAY_NAME}</string>
            <key>CFBundleDisplayName</key><string>${PROBE_DISPLAY_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          cat > "$RUNNER_TEMP/m02_probe_app.swift" <<'SWIFT'
          import ApplicationServices
          import Foundation

          func messagingError() -> Int32 {
              let systemWide = AXUIElementCreateSystemWide()
              var names: CFArray?
              return AXUIElementCopyAttributeNames(systemWide, &names).rawValue
          }

          guard CommandLine.arguments.count >= 2 else { exit(2) }
          let path = CommandLine.arguments[1]
          let payload: [String: Any] = [
              "pid": ProcessInfo.processInfo.processIdentifier,
              "trusted": AXIsProcessTrusted(),
              "messaging_error": messagingError(),
              "timestamp": Date().timeIntervalSince1970,
          ]
          let data = try JSONSerialization.data(withJSONObject: payload, options: [.prettyPrinted, .sortedKeys])
          try data.write(to: URL(fileURLWithPath: path), options: .atomic)
          Thread.sleep(forTimeInterval: 30.0)
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/m02_probe_app.swift" -o "$exe"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "PROBE_APP=$app" >> "$GITHUB_ENV"
          echo "PROBE_EXE=$exe" >> "$GITHUB_ENV"

      - name: Seed isolated user TCC grant with exact probe designated requirement
        run: |
          set -euo pipefail
          codesign -d -r- "$PROBE_APP" > "$RUNNER_TEMP/probe-requirement.raw" 2>&1 || true
          cat "$RUNNER_TEMP/probe-requirement.raw"
          requirement="$(sed -n 's/^[[:space:]]*designated => //p' "$RUNNER_TEMP/probe-requirement.raw" | head -1)"
          test -n "$requirement"
          printf 'M02_ISOLATED_REQUIREMENT=%s\n' "$requirement"
          printf '%s\n' "$requirement" > "$RUNNER_TEMP/probe-designated-requirement.txt"
          /usr/bin/csreq -r "$requirement" -b "$RUNNER_TEMP/probe.csreq"
          test -s "$RUNNER_TEMP/probe.csreq"
          python3 - "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$RUNNER_TEMP/probe.csreq" "$PROBE_BUNDLE_ID" <<'PY'
          import sqlite3, sys, time
          db, req_path, bundle_id = sys.argv[1:]
          req = open(req_path, 'rb').read()
          conn = sqlite3.connect(db, timeout=10)
          conn.row_factory = sqlite3.Row
          columns = [row[1] for row in conn.execute('PRAGMA table_info(access)')]
          source = conn.execute(
              "SELECT * FROM access WHERE service='kTCCServiceAccessibility' AND client='com.apple.Terminal' LIMIT 1"
          ).fetchone()
          if source is None:
              raise SystemExit('Terminal Accessibility fixture row unavailable')
          record = dict(source)
          record['client'] = bundle_id
          record['client_type'] = 0
          record['auth_value'] = 2
          if 'auth_reason' in record:
              record['auth_reason'] = 3
          if 'auth_version' in record:
              record['auth_version'] = max(int(record.get('auth_version') or 1), 1)
          if 'csreq' in record:
              record['csreq'] = req
          if 'last_modified' in record:
              record['last_modified'] = int(time.time())
          conn.execute("DELETE FROM access WHERE service='kTCCServiceAccessibility' AND client=?", (bundle_id,))
          names = [name for name in columns if name in record]
          placeholders = ','.join('?' for _ in names)
          conn.execute(
              f"INSERT INTO access ({','.join(names)}) VALUES ({placeholders})",
              [record[name] for name in names],
          )
          conn.commit()
          row = conn.execute(
              "SELECT client,client_type,auth_value,auth_reason,length(csreq) AS csreq_len FROM access WHERE service='kTCCServiceAccessibility' AND client=?",
              (bundle_id,),
          ).fetchone()
          print('M02_ISOLATED_GRANT_ROW', dict(row) if row else None)
          conn.close()
          PY
          killall -u "$USER" tccd || true
          sleep 1

      - name: Prove isolated app is actually trusted before revoke
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/probe-before.json"
          open -n "$PROBE_APP" --args "$RUNNER_TEMP/probe-before.json"
          for i in {1..100}; do
            [ -f "$RUNNER_TEMP/probe-before.json" ] && break
            sleep 0.1
          done
          test -f "$RUNNER_TEMP/probe-before.json"
          cat "$RUNNER_TEMP/probe-before.json"
          python3 - "$RUNNER_TEMP/probe-before.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d['trusted'] is True, d
          assert int(d['messaging_error']) == 0, d
          PY

      - name: Compile native System Settings isolated revoke controller
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m02_isolated_revoke.swift" <<'SWIFT'
          import ApplicationServices
          import Foundation

          func copyAttr(_ e: AXUIElement, _ a: CFString) -> (AXError, CFTypeRef?) {
              var v: CFTypeRef?
              let err = AXUIElementCopyAttributeValue(e, a, &v)
              return (err, v)
          }
          func stringValue(_ v: CFTypeRef?) -> String? {
              guard let v, CFGetTypeID(v) == CFStringGetTypeID() else { return nil }
              return v as? String
          }
          func strings(_ e: AXUIElement) -> [String] {
              [kAXTitleAttribute, kAXDescriptionAttribute, kAXValueAttribute].compactMap {
                  let (_, v) = copyAttr(e, $0 as CFString); return stringValue(v)
              }.filter { !$0.isEmpty }
          }
          func children(_ e: AXUIElement) -> [AXUIElement] {
              let (err, v) = copyAttr(e, kAXChildrenAttribute as CFString)
              guard err == .success, let v else { return [] }
              return v as? [AXUIElement] ?? []
          }
          func parent(_ e: AXUIElement) -> AXUIElement? {
              let (err, v) = copyAttr(e, kAXParentAttribute as CFString)
              guard err == .success, let v else { return nil }
              return unsafeBitCast(v, to: AXUIElement.self)
          }
          func role(_ e: AXUIElement) -> String? {
              let (_, v) = copyAttr(e, kAXRoleAttribute as CFString); return stringValue(v)
          }
          func contains(_ e: AXUIElement, _ wanted: String, _ depth: Int = 0) -> Bool {
              if depth > 5 { return false }
              if strings(e).contains(wanted) { return true }
              return children(e).contains { contains($0, wanted, depth + 1) }
          }
          func findToggle(_ e: AXUIElement, _ wanted: String, _ depth: Int = 0, _ visited: inout Int) -> AXUIElement? {
              if depth > 24 || visited >= 12000 { return nil }
              visited += 1
              if role(e) == kAXCheckBoxRole as String {
                  if strings(e).contains(wanted) { return e }
                  if let p = parent(e), contains(p, wanted) { return e }
              }
              for c in children(e) {
                  if let f = findToggle(c, wanted, depth + 1, &visited) { return f }
              }
              return nil
          }
          func value(_ e: AXUIElement) -> Int? {
              let (err, v) = copyAttr(e, kAXValueAttribute as CFString)
              guard err == .success, let n = v as? NSNumber else { return nil }
              return n.intValue
          }
          guard CommandLine.arguments.count >= 3,
                let pid = pid_t(CommandLine.arguments[1]) else { exit(2) }
          let wanted = CommandLine.arguments[2]
          let app = AXUIElementCreateApplication(pid)
          var toggle: AXUIElement?
          var visited = 0
          for _ in 0..<100 {
              visited = 0
              toggle = findToggle(app, wanted, 0, &visited)
              if toggle != nil { break }
              Thread.sleep(forTimeInterval: 0.1)
          }
          guard let t = toggle else {
              fputs("isolated probe switch not found visited=\(visited)\n", stderr); exit(3)
          }
          print("M02_ISOLATED_SWITCH before=\(String(describing:value(t))) visited=\(visited)")
          guard value(t) == 1 else { exit(4) }
          var actions: CFArray?
          let ae = AXUIElementCopyActionNames(t, &actions)
          print("M02_ISOLATED_ACTIONS error=\(ae.rawValue) actions=\(String(describing:actions))")
          guard ae == .success else { exit(5) }
          let pe = AXUIElementPerformAction(t, kAXPressAction as CFString)
          print("M02_ISOLATED_PRESS error=\(pe.rawValue)")
          guard pe == .success else { exit(6) }
          for _ in 0..<50 {
              if value(t) == 0 { break }
              Thread.sleep(forTimeInterval: 0.1)
          }
          print("M02_ISOLATED_SWITCH after=\(String(describing:value(t)))")
          guard value(t) == 0 else { exit(7) }
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/m02_isolated_revoke.swift" -o "$RUNNER_TEMP/m02_isolated_revoke"

      - name: Revoke isolated app through real Accessibility UI
        run: |
          set -euo pipefail
          open 'x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Privacy_Accessibility'
          for i in {1..100}; do
            pid="$(pgrep -x 'System Settings' | head -1 || true)"
            if [ -n "$pid" ]; then break; fi
            sleep 0.1
          done
          test -n "$pid"
          "$RUNNER_TEMP/m02_isolated_revoke" "$pid" "$PROBE_DISPLAY_NAME"
          sleep 1
          echo '=== isolated TCC row after UI revoke ==='
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT client,client_type,auth_value,auth_reason,length(csreq) FROM access WHERE service='kTCCServiceAccessibility' AND client='$PROBE_BUNDLE_ID';" || true

      - name: Measure fresh isolated app after revoke
        run: |
          set -euo pipefail
          pkill -f "$PROBE_EXE" || true
          sleep 0.5
          rm -f "$RUNNER_TEMP/probe-after.json"
          open -n "$PROBE_APP" --args "$RUNNER_TEMP/probe-after.json"
          for i in {1..100}; do
            [ -f "$RUNNER_TEMP/probe-after.json" ] && break
            sleep 0.1
          done
          test -f "$RUNNER_TEMP/probe-after.json"
          cat "$RUNNER_TEMP/probe-after.json"
          python3 - "$RUNNER_TEMP/probe-after.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print('M02_ISOLATED_AFTER trusted=', d['trusted'], 'messaging_error=', d['messaging_error'])
          PY

name: Wave 5 Vue live ownership foundation

on:
  pull_request:
    paths:
      - "crates/instrumentation/**"
      - "tools/wave5-vue-ownership/**"
      - ".github/workflows/wave5-vue-live-ownership.yml"
      - "docs/superpowers/specs/2026-09-20-wave5-vue-live-ownership-foundation-design.md"
  push:
    branches:
      - "feat/wave5-vue-live-ownership"
    paths:
      - "crates/instrumentation/**"
      - "tools/wave5-vue-ownership/**"
      - ".github/workflows/wave5-vue-live-ownership.yml"
      - "docs/superpowers/specs/2026-09-20-wave5-vue-live-ownership-foundation-design.md"

concurrency:
  group: wave5-vue-live-ownership-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Verify slice formatting
        run: |
          rustfmt --edition 2024 --check \
            crates/instrumentation/src/lib.rs \
            crates/instrumentation/examples/vue_ownership_bootstrap.rs \
            crates/instrumentation/tests/visibility_source_contract.rs

      - name: Verify bounded framework instrumentation contract
        run: cargo test -p localview-instrumentation -- --nocapture

  browser-vue3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Materialize exact LocalView ownership bootstrap
        run: cargo run -p localview-instrumentation --example vue_ownership_bootstrap > /tmp/localview-vue-ownership-bootstrap.js

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Vue 3 fixture and browser proof dependencies
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund vue@3.5.43 @vitejs/plugin-vue@6.0.9 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove Vue ownership privacy and isolation in Chromium
        working-directory: apps/desktop
        run: |
          cp ../../tools/wave5-vue-ownership/runtime.mjs ./wave5-vue-ownership-runtime.mjs
          node ./wave5-vue-ownership-runtime.mjs
          rm ./wave5-vue-ownership-runtime.mjs

  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native workspace system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check complete workspace
        run: cargo check --workspace --all-targets

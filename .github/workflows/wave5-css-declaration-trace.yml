name: Wave 5 CSS declaration trace

on:
  pull_request:
    paths:
      - "crates/instrumentation/**"
      - "crates/control/src/css_trace.rs"
      - "crates/control/src/fresh_snapshot.rs"
      - "crates/control/src/lib.rs"
      - ".github/workflows/wave5-css-declaration-trace.yml"
      - "docs/superpowers/specs/2026-09-20-wave5-css-declaration-trace-design.md"
  push:
    branches:
      - "feat/wave5-css-declaration-trace"
    paths:
      - "crates/instrumentation/**"
      - "crates/control/src/css_trace.rs"
      - "crates/control/src/fresh_snapshot.rs"
      - "crates/control/src/lib.rs"
      - ".github/workflows/wave5-css-declaration-trace.yml"
      - "docs/superpowers/specs/2026-09-20-wave5-css-declaration-trace-design.md"

concurrency:
  group: wave5-css-declaration-trace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native workspace system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Verify focused formatting
        run: |
          rustfmt --edition 2024 --check \
            crates/instrumentation/src/lib.rs \
            crates/instrumentation/tests/visibility_source_contract.rs \
            crates/control/src/fresh_snapshot.rs \
            crates/control/src/css_trace.rs \
            crates/control/src/lib.rs

      - name: Verify instrumentation contract
        run: cargo test -p localview-instrumentation --test visibility_source_contract -- --nocapture

      - name: Verify CSS trace projection
        run: cargo test -p localview-control css_trace -- --nocapture

      - name: Check changed crates
        run: cargo check -p localview-instrumentation -p localview-control --all-targets

  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native workspace system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check complete workspace
        run: cargo check --workspace --all-targets

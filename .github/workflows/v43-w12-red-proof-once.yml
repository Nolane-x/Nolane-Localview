name: V4.3 W12 Target Reincarnation Fix Once

on:
  push:
    branches: [feat/v43-l7-windows-w11-w12-race-authority]
    paths:
      - .github/workflows/v43-w12-red-proof-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  w12-target-reincarnation-fix:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LOCALVIEW_UIA_SMOKE: "1"
      LOCALVIEW_UIA_EDGE_SEED_BIN: ${{ github.workspace }}\tools\provider-seeds\windows-uia-edge-seed\bin\Release\net8.0-windows\LocalView.WindowsUiaEdgeSeed.exe
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/windows-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-l7-windows-w11-w12-race-authority
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply minimal current-target lifetime fix in runner
        shell: pwsh
        run: |
          $path = "crates/windows-uia-provider/src/lib.rs"
          $text = [System.IO.File]::ReadAllText($path)
          $needle = "            let current_fingerprint = self.fingerprint(&attachment.selection)?;"
          if (-not $text.Contains($needle)) {
            throw "expected require_current_target fingerprint line not found"
          }
          $lines = @(
            "            let hwnd = hwnd_from_u64(attachment.selection.native_window_handle);",
            "            let mut current_process_id = 0_u32;",
            "            let current_thread_id = unsafe {",
            "                // SAFETY: this is a read-only lifetime check for the exact selected HWND.",
            "                GetWindowThreadProcessId(hwnd, Some(&mut current_process_id))",
            "            };",
            "            if current_thread_id == 0",
            "                || current_process_id == 0",
            "                || current_process_id != attachment.selection.expected_process_id",
            "            {",
            "                return Err(WindowsUiaWorkerError::TargetReincarnated);",
            "            }",
            "",
            $needle
          )
          $replacement = $lines -join [Environment]::NewLine
          $text = $text.Replace($needle, $replacement)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          cargo fmt --all -- --check
          git diff --check
          git diff -- $path
      - name: Build W12 WPF edge seed
        run: dotnet build tools/provider-seeds/windows-uia-edge-seed/LocalView.WindowsUiaEdgeSeed.csproj -c Release --nologo
      - name: Prove W12 GREEN on real Windows lifecycle boundary
        shell: pwsh
        run: |
          $testName = "windows_real_provider_w12::w12_restart_rejects_pre_restart_authority_before_any_replacement_effect"
          $listed = cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w12 -- --list
          if (-not ($listed | Select-String -SimpleMatch "${testName}: test")) {
            throw "required W12 real-provider test is not registered: $testName"
          }
          cargo test --manifest-path $env:LOCALVIEW_L7_HARNESS_MANIFEST --test v43_real_provider_w12 $testName -- --ignored --exact --nocapture --test-threads=1
      - name: Commit production lifetime fix only after GREEN
        shell: pwsh
        run: |
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git add crates/windows-uia-provider/src/lib.rs
          if (git diff --cached --quiet) {
            throw "expected production target lifetime diff is empty"
          }
          git commit -m "fix(v43): type dead or reused target as reincarnated"
          git push origin HEAD:feat/v43-l7-windows-w11-w12-race-authority

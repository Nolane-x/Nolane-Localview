name: V4.3 L05 Accessibility Bus Reconnect Contract

on:
  pull_request:
    paths:
      - 'crates/linux-atspi-provider/**'
      - '.github/workflows/v43-l05-contract.yml'
  push:
    branches: [main]
    paths:
      - 'crates/linux-atspi-provider/**'
      - '.github/workflows/v43-l05-contract.yml'

permissions:
  contents: read

jobs:
  linux-l05-accessibility-bus-reconnect:
    name: Linux L05 accessibility bus reincarnation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Verify L05 test registration
        shell: bash
        run: |
          set -euo pipefail
          listed="$(cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l05_bus_reconnect_contract -- --list)"
          grep -F 'accessibility_bus_disconnect_immediately_fences_old_binding_authority: test' <<<"$listed"
          grep -F 'successful_bus_reconnect_changes_incarnation_and_old_binding_cannot_revive: test' <<<"$listed"
          grep -F 'explicit_reacquire_after_bus_reconnect_mints_fresh_binding_on_new_bus: test' <<<"$listed"
          grep -F 'observations_and_permits_are_bound_to_accessibility_bus_incarnation: test' <<<"$listed"
          grep -F 'reconnect_failure_stays_disconnected_and_does_not_advance_bus_incarnation: test' <<<"$listed"
          grep -F 'reconnect_without_disconnect_is_rejected_instead_of_rotating_authority: test' <<<"$listed"
      - name: Run Linux L05 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l05_bus_reconnect_contract -- --nocapture --test-threads=1
      - name: Retain Linux L01 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l01_defunct_binding_contract -- --nocapture --test-threads=1
      - name: Retain Linux L02 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l02_defunct_recreate_contract -- --nocapture --test-threads=1
      - name: Retain Linux L03 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l03_visible_occlusion_contract -- --nocapture --test-threads=1
      - name: Retain Linux L04 contract
        run: cargo test -p localview-linux-atspi-provider --features validation-state-injection --test l04_event_reconciliation_contract -- --nocapture --test-threads=1
      - name: Clippy Linux AT-SPI provider with validation feature
        run: cargo clippy -p localview-linux-atspi-provider --features validation-state-injection --all-targets -- -D warnings

name: Temporary Wave 5 rustfmt closure

on:
  push:
    branches:
      - "feat/wave5-component-ownership-protocol"
    paths:
      - ".github/workflows/_temp-wave5-rustfmt-closure.yml"

permissions:
  contents: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wave5-component-ownership-protocol
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format exact failing Wave 5 Rust surfaces
        run: |
          rustfmt --edition 2024 \
            crates/protocol/src/correctness.rs \
            crates/protocol/src/lib.rs \
            crates/control/src/fresh_snapshot.rs \
            crates/capture/src/lib.rs \
            crates/capture/tests/progressive_target_resolution.rs \
            crates/semantic/src/lib.rs \
            apps/desktop/src-tauri/src/trusted_ai.rs \
            apps/desktop/src-tauri/src/trusted_verify.rs
          git diff --check

      - name: Remove temporary formatter workflow and commit closure
        run: |
          rm .github/workflows/_temp-wave5-rustfmt-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(wave5): close component ownership rustfmt gate"
          git push origin HEAD:feat/wave5-component-ownership-protocol

name: Wave 8 Headless CI Reporting

on:
  pull_request:
    paths:
      - "apps/cli/**"
      - "crates/reports/**"
      - "crates/artifacts/**"
      - "crates/content-addressed/**"
      - "crates/attestation/**"
      - "tools/wave8-headless-ci/**"
      - "docs/superpowers/specs/2026-09-21-wave8-headless-ci-reporting-design.md"
      - ".github/workflows/wave8-headless-ci.yml"
  push:
    branches:
      - "feat/wave8-headless-ci-reporting"
    paths:
      - "apps/cli/**"
      - "crates/reports/**"
      - "crates/artifacts/**"
      - "crates/content-addressed/**"
      - "crates/attestation/**"
      - "tools/wave8-headless-ci/**"
      - "docs/superpowers/specs/2026-09-21-wave8-headless-ci-reporting-design.md"
      - ".github/workflows/wave8-headless-ci.yml"

concurrency:
  group: wave8-headless-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wave8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Wave 8 ownership and authority contract
        run: node tools/wave8-headless-ci/contract.mjs
      - name: Formatting (Wave 8 owned source files)
        run: rustfmt --check --edition 2024 apps/cli/src/headless.rs crates/reports/src/lib.rs crates/artifacts/src/lib.rs crates/content-addressed/src/lib.rs crates/attestation/src/lib.rs
      - name: Check Wave 8 crates
        run: cargo check -p localview -p localview-reports -p localview-artifacts -p localview-content-addressed -p localview-attestation --all-targets
      - name: Clippy Wave 8 crates
        run: cargo clippy -p localview -p localview-reports -p localview-artifacts -p localview-content-addressed -p localview-attestation --all-targets --no-deps -- -D warnings
      - name: CLI headless tests
        run: cargo test -p localview
      - name: Report tests
        run: cargo test -p localview-reports
      - name: Artifact retention tests
        run: cargo test -p localview-artifacts
      - name: Content-addressed baseline tests
        run: cargo test -p localview-content-addressed
      - name: Attestation tests
        run: cargo test -p localview-attestation

name: V4.3 Task 8 SetValue HTTP RED

on:
  push:
    branches: [feat/v43-windows-set-value-payload-authority]

permissions:
  contents: read

jobs:
  task8-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SetValue server-owned HTTP RED contract
        run: cargo test -p localview-control --test windows_consequential_set_value_control -- --nocapture

name: V4.3 Runtime Dispatch Smoke Builder

on:
  push:
    branches:
      - feat/v43-windows-uia-runtime-dispatch-adapter-clean

permissions:
  contents: write

jobs:
  build-snapshot-accessor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply immutable current snapshot accessor
        run: python .github/scripts/v43_runtime_snapshot_accessor.py
      - name: Format and compile runtime
        run: |
          cargo fmt --all
          cargo check -p localview-windows-observe-runtime --all-targets
          cargo test -p localview-windows-observe-runtime --test real_provider_dispatch_executor_contract
      - name: Commit production accessor and remove scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v43-runtime-dispatch-smoke-builder.yml
          git rm .github/scripts/v43_runtime_snapshot_accessor.py
          git add crates/windows-observe-runtime/src/runtime_manager.rs
          git commit -m "feat(windows-actions): expose immutable current runtime snapshot evidence"
          git push origin HEAD:feat/v43-windows-uia-runtime-dispatch-adapter-clean

  real-runtime-dispatch-smoke:
    needs: build-snapshot-accessor
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-uia-runtime-dispatch-adapter-clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile runtime with production adapter
        run: cargo check -p localview-windows-observe-runtime --all-targets
      - name: Real coordinator to retained UIA Invoke to durable linearization
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-observe-runtime --test windows_runtime_dispatch_smoke -- --ignored --nocapture --test-threads=1

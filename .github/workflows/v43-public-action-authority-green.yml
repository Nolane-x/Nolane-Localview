name: V43 public action authority GREEN

on:
  push:
    branches:
      - feat/v43-close-legacy-consequential-action-bypass

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply minimal fail-closed authority patch
        run: python .github/scripts/v43_public_action_authority_green.py
      - name: Format touched Rust source
        run: rustfmt --edition 2024 crates/control/src/runtime.rs
      - name: Public action authority contract
        run: cargo test -p localview-control --test public_action_authority -- --nocapture
      - name: Control regression suite
        run: cargo test -p localview-control --tests
      - name: Control all-target compile
        run: cargo check -p localview-control --all-targets
      - name: Commit GREEN production patch and remove temporary harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v43-public-action-authority-red.yml
          git rm .github/workflows/v43-public-action-authority-green.yml
          git rm .github/scripts/v43_public_action_authority_green.py
          git add crates/control/src/runtime.rs
          git commit -m "fix(v43): require canonical authority for public consequential actions"
          git push origin HEAD:feat/v43-close-legacy-consequential-action-bypass

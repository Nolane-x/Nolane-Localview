name: V43 runtime postcondition RED gate

on:
  push:
    branches:
      - feat/v43-windows-runtime-postcondition-capture
    paths:
      - .github/workflows/v43-runtime-postcondition-red.yml
      - crates/windows-observe-runtime/tests/postcondition_capture_contract.rs

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile causal runtime capture contract
        run: cargo test -p localview-windows-observe-runtime --test postcondition_capture_contract --no-run

name: V4.3 L05 RED Probe

on:
  push:
    branches: [wip/v43-l05-real-oracle]
    paths:
      - 'crates/linux-atspi-provider/**'
      - '.github/workflows/v43-l05-red-probe.yml'

concurrency:
  group: localview-v43-l05-red-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  l05-red-probe:
    name: L05 RED Linux cross-check probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Type-check wished-for Linux L05 contract
        run: cargo check -p localview-linux-atspi-provider --features validation-state-injection --target x86_64-unknown-linux-gnu --test l05_bus_reconnect_contract

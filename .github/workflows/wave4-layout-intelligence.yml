name: Wave 4 live layout intelligence

on:
  pull_request:
    paths:
      - "crates/layout/**"
      - "crates/live-analysis/**"
      - "crates/diagnostics/**"
      - ".github/workflows/wave4-layout-intelligence.yml"
      - "docs/superpowers/specs/2026-09-20-wave4-live-layout-intelligence-design.md"
  push:
    branches:
      - "feat/wave4-layout-live-intelligence"
    paths:
      - "crates/layout/**"
      - "crates/live-analysis/**"
      - "crates/diagnostics/**"
      - ".github/workflows/wave4-layout-intelligence.yml"
      - "docs/superpowers/specs/2026-09-20-wave4-live-layout-intelligence-design.md"

concurrency:
  group: wave4-layout-intelligence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  focused-layout-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Normalize and commit focused formatting
        run: |
          rustfmt --edition 2024 \
            crates/layout/src/lib.rs \
            crates/layout/src/model.rs \
            crates/layout/src/analysis.rs \
            crates/layout/tests/live_layout_intelligence.rs \
            crates/live-analysis/src/lib.rs \
            crates/live-analysis/src/layout.rs \
            crates/live-analysis/tests/layout_live_integration.rs \
            crates/diagnostics/src/lib.rs
          git add \
            crates/layout/src/lib.rs \
            crates/layout/src/model.rs \
            crates/layout/src/analysis.rs \
            crates/layout/tests/live_layout_intelligence.rs \
            crates/live-analysis/src/lib.rs \
            crates/live-analysis/src/layout.rs \
            crates/live-analysis/tests/layout_live_integration.rs \
            crates/diagnostics/src/lib.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: rustfmt Wave 4 layout lane"
            git push origin HEAD:feat/wave4-layout-live-intelligence
          fi

      - name: Check affected crates
        run: cargo check -p localview-layout -p localview-live-analysis -p localview-diagnostics --all-targets

      - name: Clippy affected crates
        run: cargo clippy -p localview-layout -p localview-live-analysis -p localview-diagnostics --all-targets -- -D warnings

      - name: Test layout algorithms and adversarial cases
        run: cargo test -p localview-layout -- --nocapture

      - name: Test live layout evidence integration
        run: cargo test -p localview-live-analysis -- --nocapture

      - name: Test diagnostic class preservation
        run: cargo test -p localview-diagnostics -- --nocapture

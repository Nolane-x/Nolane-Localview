name: Human-first UI V2 red-green gate

on:
  push:
    branches:
      - feat/human-first-localview-ui-v2
    paths:
      - .github/workflows/human-first-ui-v2-tdd.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify RED contract
        run: cargo test -p localview-desktop --test human_first_ui_v2_contract -- --nocapture

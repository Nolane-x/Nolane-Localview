name: V4.3 UIA Dispatch Green Builder v3

on:
  push:
    branches: [feat/v43-windows-uia-real-pattern-dispatch]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-uia-real-pattern-dispatch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply structural worker patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('crates/windows-uia-provider/src/lib.rs')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          once('    InvalidDispatchContextRequest,\n', '''    InvalidDispatchContextRequest,
              #[error("Windows UI Automation pattern dispatch request is invalid")]
              InvalidPatternDispatchRequest,
              #[error("Windows UI Automation pattern is not enabled for real dispatch: {pattern:?}")]
              PatternDispatchUnsupported { pattern: crate::WindowsUiaPattern },
              #[error("Windows UI Automation pattern is unavailable at the final dispatch boundary: {pattern:?}")]
              PatternUnavailable { pattern: crate::WindowsUiaPattern },
          ''', 'errors')
          once('CUIAutomation, IUIAutomation, IUIAutomationElement, IUIAutomationTreeWalker,',
               'CUIAutomation, IUIAutomation, IUIAutomationElement, IUIAutomationInvokePattern, IUIAutomationTreeWalker,','invoke interface')
          once('                UIA_IsInvokePatternAvailablePropertyId,',
               '                UIA_InvokePatternId, UIA_IsInvokePatternAvailablePropertyId,','invoke id')
          once('        WindowsUiaDispatchContextRequest, WindowsUiaPattern, WindowsUiaPatternSupport,',
               '        WindowsUiaDispatchContextRequest, WindowsUiaPattern, WindowsUiaPatternDispatchReceipt,\n        WindowsUiaPatternDispatchRequest, WindowsUiaPatternSupport,','crate imports')

          sentinel='''        Shutdown,
              }
          
              struct RetainedElementLease {'''
          replacement='''        DispatchPattern {
                  attachment: WindowsUiaAttachment,
                  request: WindowsUiaPatternDispatchRequest,
                  reply: Sender<Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError>>,
              },
              Shutdown,
          }
          
              struct RetainedElementLease {'''
          once(sentinel,replacement,'command sentinel')

          close='''    }
          
              impl Drop for WindowsUiaWorker {'''
          public_method='''        pub fn dispatch_pattern(
                  &self,
                  attachment: &WindowsUiaAttachment,
                  request: WindowsUiaPatternDispatchRequest,
              ) -> Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
                  if request.dispatch_attempt_ref.is_nil()
                      || request.action_id.is_nil()
                      || request.preparation_journal_sequence == 0
                      || request.preparation_receipt_ref.trim().is_empty()
                      || request.snapshot_cut_ref.trim().is_empty()
                      || request.provider_incarnation_ref != self.provider_incarnation_ref
                      || request.provider_incarnation_ref != attachment.provider_incarnation_ref
                      || request.target_incarnation_ref != attachment.target_incarnation_ref
                  {
                      return Err(WindowsUiaWorkerError::InvalidPatternDispatchRequest);
                  }
                  let (reply_tx, reply_rx) = mpsc::channel();
                  self.sender.send(WorkerCommand::DispatchPattern {
                      attachment: attachment.clone(), request, reply: reply_tx,
                  }).map_err(|_| WindowsUiaWorkerError::WorkerUnavailable)?;
                  recv_command(reply_rx, self.command_timeout)
              }
          
          '''
          once(close,public_method+close,'public impl close')

          once('                WorkerCommand::Shutdown => break,', '''                WorkerCommand::DispatchPattern { attachment, request, reply } => {
                      let _ = reply.send(state.dispatch_pattern(&attachment, request));
                  }
                  WorkerCommand::Shutdown => break,''','worker match')

          marker="        fn exact_retained_element<'a>(\n"
          impl='''        fn dispatch_pattern(
                  &self,
                  attachment: &WindowsUiaAttachment,
                  request: WindowsUiaPatternDispatchRequest,
              ) -> Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
                  if request.provider_incarnation_ref != self.provider_incarnation_ref
                      || request.provider_incarnation_ref != attachment.provider_incarnation_ref
                      || request.target_incarnation_ref != attachment.target_incarnation_ref {
                      return Err(WindowsUiaWorkerError::TargetReincarnated);
                  }
                  let context = self.revalidate_dispatch_context(attachment, WindowsUiaDispatchContextRequest {
                      snapshot_cut_ref: request.snapshot_cut_ref.clone(),
                      element_ref: request.element_ref.clone(),
                      requirements: request.context_requirements,
                  })?;
                  let retained = self.exact_retained_element(attachment, &request.snapshot_cut_ref, &request.element_ref)?;
                  match request.required_pattern {
                      WindowsUiaPattern::Invoke => {
                          if read_pattern_support(&retained.element, UIA_IsInvokePatternAvailablePropertyId)
                              != WindowsUiaPatternSupport::Supported {
                              return Err(WindowsUiaWorkerError::PatternUnavailable { pattern: WindowsUiaPattern::Invoke });
                          }
                          let invoke = unsafe {
                              retained.element.GetCurrentPatternAs::<IUIAutomationInvokePattern>(UIA_InvokePatternId)
                          }.map_err(|_| WindowsUiaWorkerError::PatternUnavailable { pattern: WindowsUiaPattern::Invoke })?;
                          unsafe { invoke.Invoke() }
                              .map_err(|e| WindowsUiaWorkerError::ProviderFailure(e.to_string()))?;
                      }
                      pattern => return Err(WindowsUiaWorkerError::PatternDispatchUnsupported { pattern }),
                  }
                  Ok(WindowsUiaPatternDispatchReceipt {
                      dispatch_attempt_ref: request.dispatch_attempt_ref,
                      action_id: request.action_id,
                      preparation_journal_sequence: request.preparation_journal_sequence,
                      preparation_receipt_ref: request.preparation_receipt_ref,
                      snapshot_cut_ref: request.snapshot_cut_ref,
                      provider_incarnation_ref: request.provider_incarnation_ref,
                      target_incarnation_ref: request.target_incarnation_ref,
                      element_ref: request.element_ref,
                      required_pattern: request.required_pattern,
                      context_requirements: request.context_requirements,
                      final_context: context.observation,
                      transport_result: localview_protocol::TransportResult::DeliveredToExecutor,
                      dispatch_result: localview_protocol::DispatchResult::DispatchedFull,
                  })
              }
          
          '''
          once(marker,impl+marker,'state insertion')

          idx=s.rfind('\n}')
          if idx < 0: raise SystemExit('final nonwindows impl close missing')
          stub='''
              pub fn dispatch_pattern(
                  &self,
                  _attachment: &WindowsUiaAttachment,
                  _request: crate::WindowsUiaPatternDispatchRequest,
              ) -> Result<crate::WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {
                  Err(WindowsUiaWorkerError::UnsupportedPlatform)
              }
          '''
          s=s[:idx]+stub+s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compile provider and all targets
        run: cargo check -p localview-windows-uia-provider --all-targets
      - name: Test provider contracts
        run: cargo test -p localview-windows-uia-provider
      - name: Commit validated production patch
        shell: bash
        run: |
          rm -f .github/workflows/v43-uia-dispatch-green.yml .github/workflows/v43-uia-dispatch-green-v2.yml .github/workflows/v43-uia-dispatch-green-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-uia-provider .github/workflows
          git commit -m "feat(windows-uia): dispatch retained Invoke pattern atomically"
          git push origin HEAD:feat/v43-windows-uia-real-pattern-dispatch

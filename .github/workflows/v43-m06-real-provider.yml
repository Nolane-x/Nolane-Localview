name: V4.3 M06 Real Provider Seed

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: localview-v43-m06-real-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m06-real-provider:
    name: M06 observer application restart invalidates old observer authority
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      LOCALVIEW_MACOS_AX_SMOKE: "1"
      LOCALVIEW_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/macos-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind exact M06 candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$LOCALVIEW_CANDIDATE_SHA" ]; then
            echo "M06 checkout SHA mismatch: actual=$actual expected=$LOCALVIEW_CANDIDATE_SHA" >&2
            exit 1
          fi
      - name: Require exact M06 real-provider registration
        run: |
          set -euo pipefail
          test_name="macos_real_provider_m06::m06_relaunch_retires_old_observer_application_incarnation"
          listed="$(cargo test --manifest-path "$LOCALVIEW_L7_HARNESS_MANIFEST" --test v43_real_provider_m06 -- --list)"
          printf '%s\n' "$listed" | grep -F "${test_name}: test"

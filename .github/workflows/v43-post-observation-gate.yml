name: V43 causal postcondition gate

on:
  push:
    branches:
      - feat/v43-post-dispatch-observation-authority
    paths:
      - .github/workflows/v43-post-observation-gate.yml
      - crates/live-bridge/src/consequential_journal.rs
      - crates/live-bridge/src/postcondition_reconciliation.rs
      - crates/live-bridge/tests/v43_post_dispatch_observation_authority.rs
      - crates/live-bridge/tests/v43_postcondition_observation_required.rs
      - crates/live-bridge/tests/v43_postcondition_reconciliation.rs
      - crates/live-bridge/tests/v43_postcondition_reconciliation_recovery.rs

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile live bridge
        run: cargo check -p localview-live-bridge --all-targets
      - name: Causal observation authority
        run: cargo test -p localview-live-bridge --test v43_post_dispatch_observation_authority -- --nocapture
      - name: Observation-required reconciliation
        run: cargo test -p localview-live-bridge --test v43_postcondition_observation_required -- --nocapture
      - name: Typed reconciliation regressions
        run: cargo test -p localview-live-bridge --test v43_postcondition_reconciliation -- --nocapture
      - name: Recovery reconciliation regressions
        run: cargo test -p localview-live-bridge --test v43_postcondition_reconciliation_recovery -- --nocapture
      - name: Consequential journal regression
        run: cargo test -p localview-live-bridge --test v43_consequential_journal -- --nocapture

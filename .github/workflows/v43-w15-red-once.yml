name: V4.3 W15 RED Once

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/windows-observe-runtime/**'
      - '.github/workflows/v43-w15-red-once.yml'

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bind exact W15 RED candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run exact W15 resource-bounded contract
        run: cargo test -p localview-windows-observe-runtime --test w15_resource_bounded_contract -- --nocapture

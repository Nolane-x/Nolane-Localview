name: V43 public action authority RED

on:
  push:
    branches:
      - feat/v43-close-legacy-consequential-action-bypass

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Public action authority boundary
        run: cargo test -p localview-control --test public_action_authority -- --nocapture

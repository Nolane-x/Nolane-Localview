name: V43 Windows smoke clippy fix

on:
  push:
    branches:
      - feat/v43-windows-runtime-postcondition-capture

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-runtime-postcondition-capture
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply minimal Clippy fix
        run: python .github/scripts/fix_windows_smoke_clippy.py
      - name: Format target
        run: rustfmt crates/windows-observe-runtime/tests/windows_runtime_dispatch_smoke.rs
      - name: Diff check
        run: git diff --check -- crates/windows-observe-runtime/tests/windows_runtime_dispatch_smoke.rs
      - name: Commit clean production fix
        shell: bash
        run: |
          rm -f .github/workflows/v43-windows-smoke-clippy-fix.yml
          rm -f .github/scripts/fix_windows_smoke_clippy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-observe-runtime/tests/windows_runtime_dispatch_smoke.rs .github/workflows .github/scripts
          git commit -m "fix(v43): use pointer cast for Windows smoke wndproc"
          git push origin HEAD:feat/v43-windows-runtime-postcondition-capture

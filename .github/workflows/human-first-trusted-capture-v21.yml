name: Human-first trusted Capture V2.1 gate

on:
  push:
    branches:
      - feat/human-first-trusted-capture-v21
    paths:
      - .github/workflows/human-first-trusted-capture-v21.yml
      - .github/workflows/human-first-trusted-capture-v21-render.yml
      - apps/desktop/src/**
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/tests/human_first_trusted_capture_v21_contract.rs
      - docs/superpowers/specs/2026-09-18-human-first-trusted-capture-v21.md
  workflow_dispatch:

concurrency:
  group: human-first-trusted-capture-v21-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify trusted Capture V2.1 contract
        run: cargo test -p localview-desktop --test human_first_trusted_capture_v21_contract -- --nocapture
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

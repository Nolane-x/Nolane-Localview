name: V43 action postcondition receipt GREEN builder

on:
  push:
    branches:
      - feat/v43-durable-action-postcondition-receipt

permissions:
  contents: write

jobs:
  green:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python .github/scripts/v43_action_postcondition_receipt_green.py

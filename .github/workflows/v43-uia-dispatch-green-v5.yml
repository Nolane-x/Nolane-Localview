name: V4.3 UIA Dispatch Green Builder v5

on:
  push:
    branches: [feat/v43-windows-uia-real-pattern-dispatch]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-uia-real-pattern-dispatch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reuse structural worker patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/v43-uia-dispatch-green-v3.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(y) if l.strip()=="python - <<'PY'")+1
          end=next(i for i in range(start,len(y)) if y[i].strip()=='PY')
          exec(compile('\n'.join(l[10:] if l.startswith('          ') else l for l in y[start:end]),'v3-patch','exec'))
          PY
      - name: Patch canonical worker facades
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          specs=[('subscription.rs','        '),('subscription_stub.rs','    ')]
          for filename,indent in specs:
              p=Path('crates/windows-uia-provider/src')/filename
              s=p.read_text(encoding='utf-8')
              old='    WindowsUiaBoundDispatchContextReceipt, WindowsUiaDispatchContextRequest, WindowsUiaEventDrain,\n'
              new=old+'    WindowsUiaPatternDispatchReceipt, WindowsUiaPatternDispatchRequest,\n'
              if s.count(old)!=1: raise SystemExit(f'{filename}: import anchor {s.count(old)}')
              s=s.replace(old,new,1)
              marker=indent+'pub fn subscribe_events(\n'
              if s.count(marker)!=1: raise SystemExit(f'{filename}: subscribe anchor {s.count(marker)}')
              wrapper=(indent+'pub fn dispatch_pattern(\n'
                       +indent+'    &self,\n'
                       +indent+'    attachment: &WindowsUiaAttachment,\n'
                       +indent+'    request: WindowsUiaPatternDispatchRequest,\n'
                       +indent+') -> Result<WindowsUiaPatternDispatchReceipt, WindowsUiaWorkerError> {\n'
                       +indent+'    self.inner.dispatch_pattern(attachment, request)\n'
                       +indent+'}\n\n')
              s=s.replace(marker,wrapper+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compile provider and all targets
        run: cargo check -p localview-windows-uia-provider --all-targets
      - name: Test provider contracts
        run: cargo test -p localview-windows-uia-provider
      - name: Commit validated production patch
        shell: bash
        run: |
          rm -f .github/workflows/v43-uia-dispatch-green*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-uia-provider .github/workflows
          git commit -m "feat(windows-uia): dispatch retained Invoke pattern atomically"
          git push origin HEAD:feat/v43-windows-uia-real-pattern-dispatch

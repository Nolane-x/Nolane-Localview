name: Human-first trusted Verify Change V2.6 gate

on:
  push:
    branches:
      - feat/human-first-trusted-verify-v26
    paths:
      - .github/workflows/human-first-trusted-verify-v26.yml
      - .github/workflows/human-first-trusted-verify-v26-render.yml
      - docs/superpowers/specs/2026-09-19-human-first-trusted-verify-v26.md
      - apps/desktop/src/**
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/permissions/**
      - apps/desktop/src-tauri/tests/human_first_trusted_verify_v26_contract.rs
      - apps/desktop/src-tauri/tests/human_first_trusted_fix_v25_contract.rs
      - apps/desktop/src-tauri/tests/human_first_trusted_ask_ai_v24_contract.rs
      - apps/desktop/src-tauri/tests/human_first_trusted_open_source_v23_contract.rs
      - apps/desktop/src-tauri/tests/human_first_trusted_measure_v22_contract.rs
      - apps/desktop/src-tauri/tests/human_first_trusted_capture_v21_contract.rs
      - crates/visual/**
      - crates/native-capture/**
      - crates/artifacts/**
      - tools/human-first-ui-v2/**
      - Cargo.toml
      - Cargo.lock
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
  workflow_dispatch:

concurrency:
  group: human-first-trusted-verify-v26-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify trusted Verify Change V2.6 contract
        run: cargo test -p localview-desktop --test human_first_trusted_verify_v26_contract -- --nocapture

      - name: Verify trusted Verify focused unit tests
        run: cargo test -p localview-desktop trusted_verify --lib -- --nocapture

      - name: Verify trusted Fix V2.5 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_fix_v25_contract -- --nocapture

      - name: Verify trusted Ask AI V2.4 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_ask_ai_v24_contract -- --nocapture

      - name: Verify trusted Open Source V2.3 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_open_source_v23_contract -- --nocapture

      - name: Verify trusted Measure V2.2 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_measure_v22_contract -- --nocapture

      - name: Verify trusted Capture V2.1 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_capture_v21_contract -- --nocapture

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

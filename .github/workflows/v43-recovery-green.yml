name: V43 consequential recovery GREEN

on:
  push:
    branches:
      - feat/v43-consequential-recovery-coordinator

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Consequential restart recovery contract
        run: cargo test -p localview-windows-observe-runtime --test execution_coordinator_behavior restart_ -- --nocapture
      - name: Verified execution regression contract
        run: cargo test -p localview-windows-observe-runtime --test execution_coordinator_behavior verified_ -- --nocapture
      - name: Runtime all-target compile
        run: cargo check -p localview-windows-observe-runtime --all-targets

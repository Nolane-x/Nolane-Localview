name: V43 migrate consequential reconciliation

on:
  push:
    branches:
      - feat/v43-post-dispatch-observation-authority
    paths:
      - tools/v43_migrate_consequential_reconciliation.py
      - .github/workflows/v43-migrate-consequential-reconciliation.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-post-dispatch-observation-authority
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Migrate legacy journal reconciliation helper
        run: python tools/v43_migrate_consequential_reconciliation.py
      - name: Normalize formatting
        run: cargo fmt --all
      - name: Compile live bridge
        run: cargo check -p localview-live-bridge --all-targets
      - name: Journal regression
        run: cargo test -p localview-live-bridge --test v43_consequential_journal -- --nocapture
      - name: Causal reconciliation gates
        run: |
          cargo test -p localview-live-bridge --test v43_post_dispatch_observation_authority -- --nocapture
          cargo test -p localview-live-bridge --test v43_postcondition_observation_required -- --nocapture
          cargo test -p localview-live-bridge --test v43_postcondition_reconciliation -- --nocapture
          cargo test -p localview-live-bridge --test v43_postcondition_reconciliation_recovery -- --nocapture
      - name: Remove migration scaffolding
        run: git rm .github/workflows/v43-migrate-consequential-reconciliation.yml tools/v43_migrate_consequential_reconciliation.py
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/live-bridge/tests/v43_consequential_journal.rs
          git commit -m "test(v43): use causal observation receipt in journal regression"
          git push origin HEAD:feat/v43-post-dispatch-observation-authority

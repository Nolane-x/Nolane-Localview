name: Apply visual packet runtime wiring

on:
  push:
    branches:
      - feat/token-aware-visual-packets
    paths:
      - .github/scripts/apply_visual_packet_patch.py
      - .github/workflows/apply-visual-packet-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/token-aware-visual-packets
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply exact source anchors
        run: python .github/scripts/apply_visual_packet_patch.py
      - name: Verify bounded patch
        shell: bash
        run: |
          git diff --check
          git diff -- apps/desktop/src-tauri/src/visual_capture.rs apps/desktop/src-tauri/src/lib.rs .github/workflows/ci.yml
          test "$(git diff --name-only | wc -l)" -eq 5
      - name: Commit bounded wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/visual_capture.rs apps/desktop/src-tauri/src/lib.rs .github/workflows/ci.yml .github/scripts/apply_visual_packet_patch.py .github/workflows/apply-visual-packet-patch.yml
          git commit -m "feat: wire token-aware visual packet capture"
          git push origin HEAD:feat/token-aware-visual-packets

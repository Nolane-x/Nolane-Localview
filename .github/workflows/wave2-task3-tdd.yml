name: Wave 2 Task 3 red-green gate

on:
  push:
    branches:
      - feat/guarded-full-page-stitching-impl
    paths:
      - .github/workflows/wave2-task3-tdd.yml

permissions:
  contents: write

jobs:
  task3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guarded-full-page-stitching-impl
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify RED
        run: |
          set +e
          cargo test -p localview-desktop --test full_page_page_executor_contract -- --nocapture 2>&1 | tee /tmp/task3-executor-red.log
          executor_status=${PIPESTATUS[0]}
          cargo test -p localview-live-bridge --test full_page_internal_action_contract tile_probe_result_storage_is_bounded_and_selector_free -- --nocapture 2>&1 | tee /tmp/task3-bridge-red.log
          bridge_status=${PIPESTATUS[0]}
          set -e
          test "$executor_status" -ne 0
          grep -q "instrumentation_owns_bounded_full_page_freeze_scroll_and_probe_authority" /tmp/task3-executor-red.log
          grep -q "FAILED" /tmp/task3-executor-red.log
          test "$bridge_status" -ne 0
          grep -q "tile_probe_result_storage_is_bounded_and_selector_free" /tmp/task3-bridge-red.log
          grep -q "FAILED" /tmp/task3-bridge-red.log
      - name: Apply Task 3 implementation
        run: python scripts/wave2_task3_patch.py
      - name: Verify GREEN
        run: |
          rustfmt --edition 2024 --check crates/instrumentation/src/lib.rs crates/live-bridge/src/lib.rs apps/desktop/src-tauri/src/lib.rs
          cargo test -p localview-desktop --test full_page_page_executor_contract -- --nocapture
          cargo test -p localview-live-bridge --test full_page_internal_action_contract -- --nocapture
          cargo test -p localview-instrumentation --all-targets
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/instrumentation/src/lib.rs crates/live-bridge/src/lib.rs apps/desktop/src-tauri/src/lib.rs
          git diff --cached --check
          git commit -m "feat(capture): add token-bound full-page page executor"
          git push origin HEAD:feat/guarded-full-page-stitching-impl

name: V4.3 L03 Real Provider Seed

on:
  pull_request:
    paths:
      - 'crates/linux-atspi-provider/**'
      - 'tools/provider-seeds/linux-atspi-occlusion-seed/**'
      - 'tools/validation-lab/linux-l7-real-provider-harness/**'
      - '.github/workflows/v43-l03-real-provider.yml'
  push:
    branches: [main]
    paths:
      - 'crates/linux-atspi-provider/**'
      - 'tools/provider-seeds/linux-atspi-occlusion-seed/**'
      - 'tools/validation-lab/linux-l7-real-provider-harness/**'
      - '.github/workflows/v43-l03-real-provider.yml'

permissions:
  contents: read

jobs:
  linux-l03-real-provider:
    name: Linux L03 real GTK/ATK/AT-SPI occlusion oracle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LOCALVIEW_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCALVIEW_L7_HARNESS_MANIFEST: tools/validation-lab/linux-l7-real-provider-harness/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
      - name: Install real GTK/AT-SPI/X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 xvfb xdotool at-spi2-core libatk-adaptor build-essential pkg-config libgtk-3-dev
      - name: Compile real GTK occlusion seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/localview-l03-seed" "$RUNNER_TEMP/localview-l7-real-provider"
          cc -std=c11 -Wall -Wextra -Werror \
            tools/provider-seeds/linux-atspi-occlusion-seed/seed.c \
            -o "$RUNNER_TEMP/localview-l03-seed/seed" \
            $(pkg-config --cflags --libs gtk+-3.0 atk)
          echo "LOCALVIEW_L03_SEED_BIN=$RUNNER_TEMP/localview-l03-seed/seed" >> "$GITHUB_ENV"
          echo "LOCALVIEW_L7_ARTIFACT_DIR=$RUNNER_TEMP/localview-l7-real-provider" >> "$GITHUB_ENV"
      - name: Verify exact L03 test registration
        shell: bash
        run: |
          set -euo pipefail
          listed="$(cargo test --manifest-path "$LOCALVIEW_L7_HARNESS_MANIFEST" --test v43_real_provider_l03 -- --list)"
          grep -F 'linux_real_provider_l03::l03_visible_target_requires_real_unobscured_hit_test: test' <<<"$listed"
      - name: Run real Linux L03 oracle
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a env \
            NO_AT_BRIDGE=0 \
            GTK_MODULES=gail:atk-bridge \
            LOCALVIEW_CANDIDATE_SHA="$LOCALVIEW_CANDIDATE_SHA" \
            LOCALVIEW_L03_SEED_BIN="$LOCALVIEW_L03_SEED_BIN" \
            LOCALVIEW_L7_ARTIFACT_DIR="$LOCALVIEW_L7_ARTIFACT_DIR" \
            cargo test --manifest-path "$LOCALVIEW_L7_HARNESS_MANIFEST" \
              --test v43_real_provider_l03 \
              linux_real_provider_l03::l03_visible_target_requires_real_unobscured_hit_test \
              -- --ignored --exact --nocapture --test-threads=1
      - name: Verify L03 evidence schema
        shell: python
        run: |
          import json, os, pathlib
          path = pathlib.Path(os.environ['LOCALVIEW_L7_ARTIFACT_DIR']) / 'l03-real-provider-evidence.json'
          data = json.loads(path.read_text())
          assert data['schema'] == 'localview.v43.l03.real-provider.v2'
          assert data['case_id'] == 'L03'
          assert data['candidate_sha'] == os.environ['LOCALVIEW_CANDIDATE_SHA']
          assert data['provider_family'] == 'linux_atspi'
          assert data['target_visible_while_occluded'] is True
          assert data['target_showing_while_occluded'] is True
          assert data['blocker_visible_while_occluding'] is True
          assert data['blocker_showing_while_occluding'] is True
          assert data['blocker_overlaps_target_center'] is True
          assert data['target_and_blocker_are_atspi_siblings'] is True
          assert data['raw_atspi_hit_before'] == 'LocalView L03 Visible Target'
          assert data['atspi_self_hit_false_positive'] is True
          assert data['actual_pointer_recipient_before'] == 'LocalView L03 Occluding Blocker'
          assert data['shipping_pointer_denial'] == 'occluded'
          assert data['semantic_authorization_while_occluded'] is True
          assert data['raw_atspi_hit_after'] == 'LocalView L03 Visible Target'
          assert data['actual_pointer_recipient_after'] == 'LocalView L03 Visible Target'
          assert data['post_unblock_pointer_authorized'] is True
          assert data['ground_truth_source'] == 'real_x11_pointer_delivery_plus_gtk_atk_atspi_geometry'
      - name: Record run context
        if: always()
        shell: bash
        run: |
          printf '{"candidate_sha":"%s","case_id":"L03"}\n' "$LOCALVIEW_CANDIDATE_SHA" > "$LOCALVIEW_L7_ARTIFACT_DIR/run-context.json"
      - name: Upload exact-head L03 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v43-l03-real-provider-${{ env.LOCALVIEW_CANDIDATE_SHA }}
          path: ${{ env.LOCALVIEW_L7_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30

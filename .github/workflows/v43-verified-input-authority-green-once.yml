name: V4.3 Verified Input Authority GREEN Once

on:
  push:
    branches:
      - feat/v43-l7-windows-w07-w08-w09-input-authority

permissions:
  contents: write

jobs:
  authority-binding-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/v43-l7-windows-w07-w08-w09-input-authority
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact-anchor authority patch
        run: python .github/scripts/v43_verified_input_authority_green.py
      - name: Format
        run: cargo fmt --all
      - name: Opaque authority and receipt binding contract
        run: cargo test -p localview-windows-uia-provider --test verified_input_authority_binding_contract -- --nocapture
      - name: Pure verified-input contracts
        run: cargo test -p localview-windows-uia-provider --test verified_input_contract -- --nocapture
      - name: Boundary ordering contracts
        run: cargo test -p localview-windows-uia-provider --test verified_input_worker_contract -- --nocapture
      - name: Production backend contract
        run: cargo test -p localview-windows-uia-provider --test windows_verified_input_backend_contract -- --nocapture
      - name: Exact MTA worker contract
        run: cargo test -p localview-windows-uia-provider --test windows_verified_input_worker_mta_contract -- --nocapture
      - name: Consequential journal regressions
        run: cargo test -p localview-live-bridge --lib -- --nocapture
      - name: Runtime dispatch classification regression
        run: cargo test -p localview-windows-observe-runtime --test verified_input_dispatch_classification -- --nocapture
      - name: Provider compile gate
        run: cargo check -p localview-windows-uia-provider
      - name: Remove one-shot machinery and commit GREEN
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v43-verified-input-authority-green-once.yml .github/scripts/v43_verified_input_authority_green.py
          git add -A
          git diff --cached --check
          git commit -m "feat(v43): bind verified input to one-shot journal authority"
          git push origin HEAD:feat/v43-l7-windows-w07-w08-w09-input-authority

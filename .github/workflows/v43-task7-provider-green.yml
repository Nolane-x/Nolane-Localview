          # Production runtime adapter: same operation gate + active attachment as generic dispatch.
          runtime = Path('crates/windows-observe-runtime/src/runtime_manager.rs')
          s = runtime.read_text(encoding='utf-8')
          anchor = '\nimpl<P: WindowsObserveProvider> WindowsObserveRuntimeManager<P> {'

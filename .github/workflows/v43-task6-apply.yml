name: V4.3 Task 6 verified apply

on:
  push:
    branches:
      - feat/v43-windows-set-value-payload-authority
    paths:
      - .github/workflows/v43-task6-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v43-windows-set-value-payload-authority
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact audited worker patch
        run: python scripts/v43_task6_apply.py
      - name: Format provider
        run: cargo fmt -p localview-windows-uia-provider
      - name: Check provider all targets
        run: cargo check -p localview-windows-uia-provider --all-targets
      - name: Task 6 request contract
        run: cargo test -p localview-windows-uia-provider --test set_value_dispatch_contract -- --nocapture
      - name: Real Win32 SetValue dispatch smoke
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test set_value_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Existing Invoke regression
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test pattern_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Existing SelectionItem regression
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test selection_item_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Existing Toggle regression
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test toggle_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Existing ExpandCollapse regression
        env:
          LOCALVIEW_UIA_SMOKE: "1"
        run: cargo test -p localview-windows-uia-provider --test expand_collapse_dispatch_worker_smoke -- --ignored --nocapture --test-threads=1
      - name: Commit only after Windows proof
        shell: bash
        run: |
          git rm .github/workflows/v43-task6-apply.yml scripts/v43_task6_apply.py
          git add crates/windows-uia-provider/src/lib.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(windows-uia): execute one-shot SetValue on MTA worker"
          git push origin HEAD:feat/v43-windows-set-value-payload-authority

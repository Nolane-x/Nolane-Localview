name: V4.3 Task 8 Materialize Stage 4 Permanent Test

on:
  pull_request:
    paths:
      - '.github/workflows/v43-task8-stage4-red.yml'

permissions:
  contents: write

jobs:
  materialize-stage4:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize exact-confirmation regression into permanent smoke
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/control/tests/windows_consequential_set_value_windows_smoke.rs')
          text = path.read_text(encoding='utf-8')

          old = '''        let response = app\n            .oneshot(\n'''
          new = '''        let response = app\n            .clone()\n            .oneshot(\n'''
          if text.count(old) != 1:
              raise SystemExit('plan request app anchor was not unique')
          text = text.replace(old, new, 1)

          old = '''        assert!(plan["confirmation_ref"].as_str().is_some());\n        let precondition_cut = plan["precondition_snapshot_cut_ref"]\n'''
          new = '''        let confirmation_ref = Uuid::parse_str(\n            plan["confirmation_ref"]\n                .as_str()\n                .expect("SetValue plan response must contain confirmation_ref"),\n        )\n        .expect("parse SetValue confirmation_ref");\n        let precondition_cut = plan["precondition_snapshot_cut_ref"]\n'''
          if text.count(old) != 1:
              raise SystemExit('confirmation_ref anchor was not unique')
          text = text.replace(old, new, 1)

          marker = '''        configure_windows_consequential_control_for_sessions(&sessions, None);\n'''
          insert = '''        let confirm_response = app\n            .clone()\n            .oneshot(\n                Request::builder()\n                    .method("POST")\n                    .uri(format!(\n                        "/v1/sessions/{session_id}/windows-observe/consequential/{action_id}/confirm"\n                    ))\n                    .header(AUTHORIZATION, "Bearer set-value-control-smoke-token")\n                    .header("content-type", "application/json")\n                    .body(Body::from(\n                        serde_json::json!({"confirmation_ref": confirmation_ref}).to_string(),\n                    ))\n                    .expect("build exact SetValue confirmation request"),\n            )\n            .await\n            .expect("run exact SetValue confirmation request");\n        let (confirm_status, confirm_body) = response_body(confirm_response).await;\n        assert!(\n            !confirm_body.contains(SENTINEL),\n            "SetValue confirmation response must never expose plaintext"\n        );\n        assert_eq!(\n            confirm_status,\n            StatusCode::OK,\n            "exact SetValue confirmation must execute through the dedicated verified SetValue path: {confirm_body}"\n        );\n        let confirmed: serde_json::Value =\n            serde_json::from_str(&confirm_body).expect("decode SetValue confirmation result");\n        assert_eq!(confirmed["status"], "committed");\n        assert_eq!(confirmed["world_outcome"], "verified_expected");\n        assert_eq!(confirmed["confirmation_consumed"], true);\n        assert_eq!(confirmed["retry_allowed"], false);\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('confirmation insertion anchor was not unique')
          text = text.replace(marker, insert + marker, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify permanent-test-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/control/tests/windows_consequential_set_value_windows_smoke.rs"
      - name: Prove materialized regression GREEN before commit
        shell: bash
        env:
          LOCALVIEW_UIA_SMOKE: '1'
        run: cargo test -p localview-control --test windows_consequential_set_value_windows_smoke -- --ignored --nocapture --test-threads=1
      - name: Commit permanent Stage 4 regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'localview-ci'
          git config user.email 'localview-ci@users.noreply.github.com'
          git add crates/control/tests/windows_consequential_set_value_windows_smoke.rs
          git commit -m 'test(v43): persist real HTTP SetValue confirmation regression'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: V4.3 Task 8 Stage 3 RED

on:
  pull_request:
    paths:
      - 'crates/control/**'
      - 'crates/windows-observe-runtime/**'
      - 'crates/windows-uia-provider/**'
      - 'crates/live-bridge/**'
      - '.github/workflows/v43-task8-stage3-red.yml'

permissions:
  contents: read

jobs:
  set-value-plan-red:
    name: Real HTTP SetValue server-owned plan RED
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run real HTTP SetValue plan contract
        env:
          LOCALVIEW_UIA_SMOKE: '1'
        run: cargo test -p localview-control --test windows_consequential_set_value_windows_smoke -- --ignored --nocapture --test-threads=1

name: Human-first trusted Measure V2.2 gate

on:
  push:
    branches:
      - feat/human-first-trusted-measure-v22
    paths:
      - .github/workflows/human-first-trusted-measure-v22.yml
      - .github/workflows/human-first-trusted-measure-v22-render.yml
      - crates/live-bridge/src/**
      - crates/control/src/**
      - crates/control/tests/**
      - apps/desktop/src/**
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/permissions/**
      - apps/desktop/src-tauri/tests/**
      - tools/human-first-ui-v2/**
      - docs/superpowers/specs/2026-09-18-human-first-trusted-measure-v22.md
  workflow_dispatch:

concurrency:
  group: human-first-trusted-measure-v22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify trusted Measure V2.2 contract
        run: cargo test -p localview-desktop --test human_first_trusted_measure_v22_contract -- --nocapture
      - name: Verify trusted Capture V2.1 remains green
        run: cargo test -p localview-desktop --test human_first_trusted_capture_v21_contract -- --nocapture
      - name: Verify LiveBridge measure action tests
        run: cargo test -p localview-live-bridge measure --lib -- --nocapture
      - name: Verify control read-only measure authority tests
        run: cargo test -p localview-control measure --lib -- --nocapture
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

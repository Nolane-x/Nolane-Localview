[[permission]]
identifier = "maincommands"
description = "Allows the bundled LocalView dashboard to inspect runtime state and live evidence, pause or resume discovery, open a localhost preview, open trusted selected-element source, capture a bounded managed viewport, and manage the bounded native workspace surface when compiled."
commands.allow = [
  "dashboard_state",
  "live_session_state",
  "action_correlation",
  "ai_provider_capability",
  "ask_ai_about_selection",
  "ai_fix_capability",
  "prepare_fix_proposal",
  "apply_fix_proposal",
  "discard_fix_proposal",
  "verify_fix_change",
  "pause_runtime",
  "resume_runtime",
  "open_preview",
  "capture_viewport",
  "capture_current_viewport",
  "open_source_for_selection",
  "measure_current_selection",
  "workspace_surface_open",
  "workspace_surface_set_bounds",
  "workspace_surface_navigate",
  "workspace_surface_close"
]

[[permission]]
identifier = "previewbridge"
description = "Allows a LocalView-managed loopback preview or workspace WebView to submit bounded observer data and execute only queued LocalView page actions through the native bridge."
commands.allow = [
  "preview_ingest",
  "preview_take_actions",
  "preview_complete_action"
]

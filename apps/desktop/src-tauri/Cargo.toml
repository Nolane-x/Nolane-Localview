[package]
name = "localview-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "localview_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "localview-desktop"
path = "src/main.rs"

[features]
default = []
native-workspace = ["tauri/unstable"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
localview-artifacts = { path = "../../../crates/artifacts" }
localview-capture = { path = "../../../crates/capture" }
localview-counterfactual = { path = "../../../crates/counterfactual" }
localview-instrumentation = { path = "../../../crates/instrumentation" }
localview-live-bridge = { path = "../../../crates/live-bridge" }
localview-native-capture = { path = "../../../crates/native-capture" }
localview-protocol = { path = "../../../crates/protocol" }
localview-resource-governor = { path = "../../../crates/resource-governor" }
localview-responsive = { path = "../../../crates/responsive" }
localview-token-budget = { path = "../../../crates/token-budget" }
localview-verification = { path = "../../../crates/verification" }
localview-visual = { path = "../../../crates/visual" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.6"
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
localview-macos-ax-provider = { path = "../../../crates/macos-ax-provider" }

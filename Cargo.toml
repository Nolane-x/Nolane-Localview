[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/core",
  "crates/discovery",
  "crates/sessions",
  "crates/observation",
  "crates/security",
  "crates/control",
  "crates/semantic",
  "crates/layout",
  "crates/visual",
  "crates/responsive",
  "crates/source-map",
  "crates/source-graph",
  "crates/project-state",
  "crates/token-budget",
  "crates/framework-adapters",
  "crates/capture",
  "crates/native-capture",
  "crates/chromium",
  "crates/engine",
  "crates/network",
  "crates/console",
  "crates/a11y",
  "crates/performance",
  "crates/flow",
  "crates/design-grammar",
  "crates/artifacts",
  "crates/instrumentation",
  "crates/diagnostics",
  "crates/reports",
  "crates/quality",
  "crates/live-bridge",
  "crates/live-analysis",
  "crates/evidence",
  "crates/causal",
  "crates/contracts",
  "crates/state-space",
  "crates/counterfactual",
  "crates/content-addressed",
  "crates/planner",
  "crates/verification",
  "crates/multi-agent",
  "crates/time-travel",
  "crates/resource-governor",
  "crates/full-stack",
  "crates/mutation",
  "crates/bisect",
  "crates/attestation",
  "crates/policy",
  "crates/inspector",
  "crates/experience",
  "crates/runtime-abi",
  "apps/daemon",
  "apps/cli",
  "apps/desktop/src-tauri",
  "integrations/mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Nolane LocalView contributors"]
repository = "https://github.com/Nolane-x/Nolane-Localview"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
http = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs", "process"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

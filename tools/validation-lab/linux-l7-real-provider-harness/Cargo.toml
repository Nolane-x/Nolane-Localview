[package]
name = "localview-linux-l7-real-provider-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[[test]]
name = "v43_real_provider_l01"
path = "tests/v43_real_provider_l01.rs"

[target.'cfg(target_os = "linux")'.dependencies]
localview-linux-atspi-provider = { path = "../../../crates/linux-atspi-provider" }
localview-protocol = { path = "../../../crates/protocol" }
atspi = { version = "=0.30.0", features = ["zbus"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package]
name = "localview-linux-l7-real-provider-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[[test]]
name = "v43_real_provider_l01"
path = "tests/v43_real_provider_l01.rs"

[[test]]
name = "v43_real_provider_l02"
path = "tests/v43_real_provider_l02.rs"

[[test]]
name = "v43_real_provider_l03"
path = "tests/v43_real_provider_l03.rs"

[[test]]
name = "v43_real_provider_l04"
path = "tests/v43_real_provider_l04.rs"

[[test]]
name = "v43_real_provider_l05"
path = "tests/v43_real_provider_l05.rs"

[target.'cfg(target_os = "linux")'.dependencies]
localview-linux-atspi-provider = { path = "../../../crates/linux-atspi-provider" }
localview-protocol = { path = "../../../crates/protocol" }
atspi = { version = "=0.30.0", features = ["zbus"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
# yoke-derive 0.8.3 is selected as Rust-1.85-compatible but does not compile on
# rustc 1.85.0; 0.8.2 is the exact derive version proven by the L04 real oracle.
yoke-derive = "=0.8.2"

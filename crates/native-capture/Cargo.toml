[package]
name = "localview-native-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
gui-smoke = []

[dependencies]
localview-capture = { path = "../capture" }
localview-protocol = { path = "../protocol" }
serde.workspace = true
thiserror.workspace = true
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSRunLoop", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["objc2-app-kit", "block2", "WKNavigation", "WKSnapshotConfiguration", "WKWebView"] }

[dev-dependencies]
localview-visual = { path = "../visual" }
serde_json.workspace = true

[[test]]
name = "macos_gui_smoke"
path = "tests/macos_gui_smoke.rs"
harness = false

[[test]]
name = "windows_gui_smoke"
path = "tests/windows_gui_smoke.rs"
harness = false

[package]
name = "localview-windows-observe-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
localview-live-bridge = { path = "../live-bridge" }
localview-native-provider = { path = "../native-provider" }
localview-protocol = { path = "../protocol" }
localview-windows-uia-provider = { path = "../windows-uia-provider" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
localview-resource-governor = { path = "../resource-governor" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
